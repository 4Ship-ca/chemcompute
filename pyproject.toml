[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wetstack"
version = "1.0.0"
description = "WetStack-0 home-lab chemical neuron: experiments, digital twin and gate proofs"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "opencv-python>=4.8",
  "matplotlib>=3.7",
  "pyserial>=3.5",
]

[tool.setuptools]
package-dir = {"" = "host"}
packages = ["wetstack"]

[tool.setuptools.package-data]
wetstack = ["gates.json"]
