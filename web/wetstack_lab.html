<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WetStack-0 lab workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Recursive:slnt,wght,CASL,CRSV,MONO@-15..0,300..900,0..1,0..1,0..1&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F7F6; --card:#FFFFFF; --ink:#172230; --muted:#586675; --rule:#D2DBE2; --wash:#EAF0F3;
  --acid:#C99510; --mid:#4F8F3A; --base:#1F5AA6; --fail:#B23A2B; --on-base:#FFFFFF;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --display:"Recursive","Segoe UI",system-ui,sans-serif;
  --mono:"Recursive",ui-monospace,"Cascadia Mono",Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10171E; --card:#16202A; --ink:#E4ECF1; --muted:#93A3B1; --rule:#2A3744; --wash:#1B2733;
    --acid:#E2B33C; --mid:#74B557; --base:#6497DA; --fail:#E46F5C; --on-base:#0D141A;
  }
}
:root[data-theme="dark"]{
  --paper:#10171E; --card:#16202A; --ink:#E4ECF1; --muted:#93A3B1; --rule:#2A3744; --wash:#1B2733;
  --acid:#E2B33C; --mid:#74B557; --base:#6497DA; --fail:#E46F5C; --on-base:#0D141A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--body)}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--base);outline-offset:2px}
a{color:var(--base)}
code,.cmd{font-family:var(--mono);font-variation-settings:"MONO" 1,"CASL" 0;font-size:.88em}
h1,h2,h3{font-family:var(--display);font-variation-settings:"CASL" .35,"MONO" 0;line-height:1.2;margin:0}
h1{font-size:clamp(1.6rem,3.2vw,2.15rem);font-weight:780;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:720;margin-top:2.2rem;margin-bottom:.6rem}
h3{font-size:1.02rem;font-weight:700;margin-top:1.4rem;margin-bottom:.35rem}
p{margin:.45rem 0 .8rem;max-width:70ch}
.muted{color:var(--muted)}
.small{font-size:.88rem}

/* header */
header.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--rule);
  padding-top:env(safe-area-inset-top,0px)}
.topin{max-width:1180px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
.brand b{font-family:var(--display);font-variation-settings:"CASL" .6;font-weight:820;font-size:1.25rem;letter-spacing:-.01em}
.brand span{font-size:.82rem;color:var(--muted)}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
nav.tabs button{border:0;background:none;padding:7px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:700}
nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--paper)}
nav.tabs button:hover:not([aria-current="page"]){background:var(--wash);color:var(--ink)}
.syncdot{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:2px}
.syncdot i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.syncdot.on i{background:var(--mid)}

/* layout */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);gap:40px;max-width:1180px;margin:0 auto;padding:28px 24px 72px}
.shell>*{min-width:0}
main{max-width:800px;min-width:0}

/* titration rail */
.rail{position:sticky;top:92px;align-self:start}
.railgrid{display:grid;grid-template-columns:22px 1fr;gap:14px}
.burette{position:relative;border:1.5px solid var(--ink);border-top:0;border-radius:0 0 11px 11px;min-height:420px;background:var(--card);overflow:hidden}
.burette .fill{position:absolute;left:0;right:0;bottom:0;overflow:hidden;transition:height .6s ease}
.burette .fill::before{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(100% / var(--p));
  background:linear-gradient(to top,var(--acid) 0%,var(--mid) 50%,var(--base) 100%)}
.burette .tick{position:absolute;left:0;width:7px;height:1.5px;background:var(--ink)}
.phases{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;justify-content:space-between;min-height:420px}
.phases button{display:flex;gap:9px;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:4px 6px;border-radius:6px;cursor:pointer;color:var(--ink)}
.phases button:hover{background:var(--wash)}
.phases button[aria-current="true"]{background:var(--wash);font-weight:700}
.phases .pid{font-family:var(--mono);font-variation-settings:"MONO" 1;font-size:.8rem;color:var(--muted);min-width:22px}
.phases .ptitle{font-size:.9rem;line-height:1.3}
.mark{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);flex:none;align-self:center}
.mark.active{border-color:var(--mid);background:var(--mid)}
.mark.passed{border-color:var(--base);background:var(--base)}
.mark.blocked{border-color:var(--acid);background:var(--acid)}
.railnote{margin-top:16px;font-size:.84rem;color:var(--muted)}
.railnote strong{color:var(--ink);font-size:1.4rem;font-family:var(--display);font-variation-settings:"CASL" .4;display:block;line-height:1.1}
.hbar{display:none}

@media (max-width:880px){
  .shell{grid-template-columns:1fr;gap:18px;padding:16px 14px 56px}
  .rail{position:static}
  .railgrid{display:none}
  .hbar{display:block}
  .hbar .htube{position:relative;height:14px;border:1.5px solid var(--ink);border-left:0;border-radius:0 7px 7px 0;background:var(--card);overflow:hidden}
  .hbar .hfill{position:absolute;top:0;bottom:0;left:0;overflow:hidden}
  .hbar .hfill::before{content:"";position:absolute;top:0;bottom:0;left:0;width:calc(100% / var(--p));background:linear-gradient(to right,var(--acid),var(--mid),var(--base))}
  .hbar .chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px}
  .hbar .chips button{flex:none;border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:4px 10px;display:flex;gap:6px;align-items:center;cursor:pointer}
  .hbar .chips button[aria-current="true"]{border-color:var(--ink);font-weight:700}
  .topin{padding:10px 14px}
  nav.tabs{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap}
}

/* blocks */
.lede{font-size:1.06rem}
.next{display:flex;gap:14px;align-items:center;justify-content:space-between;border:1.5px solid var(--ink);border-radius:10px;padding:12px 16px;margin:18px 0;background:var(--card)}
.next b{font-family:var(--display);font-variation-settings:"CASL" .4}
.btn{border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:.92rem}
.btn:hover{background:var(--wash)}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.quiet{border-color:var(--rule);font-weight:400}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hyp{border-left:3px solid var(--mid);padding:4px 0 4px 14px;margin:12px 0}
.hyp b{font-family:var(--mono);font-variation-settings:"MONO" 1;font-size:.86rem}
.hyp .pc{font-size:.9rem;color:var(--muted);margin:.2rem 0}

ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}
ol.steps>li{border-top:1px solid var(--rule);padding:16px 0}
.srow{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.stitle{font-weight:700;font-size:1.02rem;display:flex;gap:10px;align-items:baseline}
.stitle .sid{font-family:var(--mono);font-variation-settings:"MONO" 1;font-size:.82rem;color:var(--muted);font-weight:400}
li.done .stitle span.t{text-decoration:line-through;text-decoration-color:var(--base);text-decoration-thickness:2px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--card);padding:4px 9px;font-size:.82rem;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"][data-v="doing"]{background:var(--mid);color:var(--on-base)}
.seg button[aria-pressed="true"][data-v="done"]{background:var(--base);color:var(--on-base)}
.seg button[aria-pressed="true"][data-v="blocked"]{background:var(--acid);color:#1a1300}
.seg button[aria-pressed="true"][data-v="todo"]{background:var(--wash);color:var(--ink)}
.cmdline{display:flex;gap:8px;align-items:center;background:var(--wash);border-radius:7px;padding:6px 10px;margin:.5rem 0;overflow-x:auto}
.cmdline code{white-space:nowrap;flex:1}
.cmdline button{border:0;background:none;color:var(--base);cursor:pointer;font-weight:700;font-size:.82rem;flex:none}
details.more{margin-top:.4rem}
details.more summary{cursor:pointer;color:var(--base);font-weight:700;font-size:.9rem}
textarea{width:100%;min-height:76px;border:1px solid var(--rule);border-radius:8px;background:var(--card);padding:8px 10px;resize:vertical}
input[type=number],input[type=text],select{border:1px solid var(--rule);border-radius:7px;background:var(--card);padding:5px 8px}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin:.5rem 0}
.photos img{width:96px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--rule)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:.5rem}
.cam{font-size:.8rem;color:var(--muted)}

.gate{margin-top:28px;border:1.5px solid var(--ink);border-radius:12px;background:var(--card);overflow:hidden}
.gatehead{padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--rule)}
.gatehead.pass{background:var(--base);color:var(--on-base)}
.gatehead h3{margin:0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--rule);vertical-align:top;font-size:.93rem}
th{font-weight:700;color:var(--muted);font-size:.84rem}
td.num{white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.8rem;font-weight:700}
.pill.ok{background:var(--base);color:var(--on-base)}
.pill.bad{background:var(--fail);color:#fff}
.pill.wait{background:var(--wash);color:var(--muted)}
.gatebody{padding:12px 18px 16px}
.gatebody input[type=number]{width:110px}

.matrix td.w{font-weight:700}
.matrix tr.chosen td{background:var(--wash)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:.6rem 0}
.flow span{border:1px solid var(--rule);border-radius:7px;padding:4px 9px;background:var(--card);font-size:.88rem}
.flow i{color:var(--muted);font-style:normal}
dl.pairs{margin:.4rem 0}
dl.pairs dt{font-weight:700;margin-top:.7rem}
dl.pairs dd{margin:.15rem 0 0;max-width:70ch}

.totals{display:flex;gap:28px;flex-wrap:wrap;margin:10px 0 18px}
.totals div b{display:block;font-family:var(--display);font-variation-settings:"CASL" .4;font-size:1.5rem;line-height:1.1}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bom td .nm{font-weight:700}
.bom td .nt{font-size:.84rem;color:var(--muted)}
.bom tr.have td{opacity:.62}
.bom input[type=number]{width:84px}

.thread{display:flex;flex-direction:column;gap:14px;margin:14px 0}
.msg{border-left:3px solid var(--rule);padding:2px 0 2px 14px;white-space:pre-wrap;max-width:72ch}
.msg.me{border-color:var(--ink)}
.msg.lab{border-color:var(--base)}
.msg .who{font-size:.8rem;color:var(--muted);display:block;margin-bottom:2px;white-space:normal}
.compose{border:1.5px solid var(--ink);border-radius:12px;padding:12px;background:var(--card)}
.entry{border-top:1px solid var(--rule);padding:14px 0}
.entry img{max-height:260px;border-radius:8px;border:1px solid var(--rule);display:block;margin:.4rem 0}
.empty{border:1.5px dashed var(--rule);border-radius:12px;padding:18px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:9px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <div class="brand"><b>WetStack-0</b><span id="tagline"></span>
    <div class="syncdot" id="syncdot"><i></i><span>Saved in this browser</span></div></div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div></header>
<div class="shell">
  <aside class="rail" id="rail" aria-label="Phases"></aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const DATA = {"project":{"name":"WetStack-0","tagline":"A home-lab chemical neuron: electrons in, chemistry decides, light out.","version":"1.0","mvp_definition":["Electrical inputs (charge pulses) write acid or base into at least 3 micro-chambers.","The chemistry, not software, supplies every nonlinearity (buffer threshold + indicator speciation).","Chambers are read optically by camera and by optical fiber into a spectral sensor.","Chambers reset electrically for 100+ cycles with no fluid replaced.","A two-layer chemical network computes XOR at 95% or better over 40+ randomized trials, with electronics allowed only to scale signals between layers (the linear-relay rule).","An ionic diode junction is built and characterized (rectification ratio 2 or better).","The electronics run from solar, and joules per chemical operation are measured."],"principles":[["Linear-relay rule","Between chemical layers, electronics may only multiply a measured signal by a fixed gain. No thresholds, no if-statements, no clipping in software. Every decision must happen in a well."],["Absorbance, not brightness","Readout features are absorbances (log of light ratio), so Beer-Lambert's exponential cannot sneak in a nonlinearity. Any separability we claim belongs to the chemistry."],["Every claim has a control","Each positive result is paired with a run that should fail (single indicator, raw inputs, shuffled labels, undoped gel). If the control passes too, the claim does not stand."],["Simulate first, then wet","Every experiment runs against the digital twin with --sim before a drop of liquid is used. The sim is also the reference you compare real data against."],["Gates are pass/fail","You do not start a phase until the previous gate passes or I sign off on a documented exception."]],"roles":[["Lab manager (Claude)","Sets the plan, the gates and the safety rules; reviews data and photos; decides on exceptions."],["Technician / instructor (Claude)","Explains each step and why; troubleshoots failed gates with you."],["Lab partner (you)","Builds, runs, measures, photographs and records. You stop and ask when anything surprises you."]]},"path":{"question":"Which physical route gets a home lab to a working, honest chemical-compute MVP fastest and safest?","criteria":["Safety at home","Cost","Speed per op","Reversible (low consumables)","Easy to observe","Fits the long-term vision"],"weights":[3,2,1,3,2,2],"options":[{"name":"Electro-chemical pH neuron (chosen)","scores":[5,5,3,5,5,4],"note":"Charge pulses make acid or base at a platinum electrode; a buffer sets the firing threshold; an indicator shows the state; reverse charge resets it. Cheap, safe, reversible, visible."},{"name":"DNA strand displacement","scores":[5,1,1,2,3,4],"note":"Elegant and programmable, but custom DNA strands cost hundreds per design and reactions take hours."},{"name":"Belousov-Zhabotinsky oscillators","scores":[2,4,4,3,5,4],"note":"Real excitable medium, but uses strong acid and bromate. Not a first home build."},{"name":"Lipid droplet synapses","scores":[4,3,4,3,2,5],"note":"Closest to biology, but needs picoamp electrophysiology and fragile membranes."},{"name":"Living neurons / organoids","scores":[1,1,4,2,2,5],"note":"Needs a cell-culture lab. Out of scope for a home bench."},{"name":"Pure reservoir in a stirred vat","scores":[5,5,2,2,4,2],"note":"Works (Huck lab, Nature 2024) but has no spatial structure to grow into stacked layers."}],"decision":"Electro-chemical pH neuron, read optically, with an ionic-diode junction as the first inter-chamber element.","why":["It is the smallest system that has all five parts of your vision: input, threshold, state, readout, reset.","Faraday's law makes the input exact: charge in coulombs maps to moles of acid, so we can reason quantitatively.","Reverse charge undoes a write, which attacks the consumables problem from day one.","Everything upgrades in place: the salt bridge becomes a diode, the camera becomes a fiber, the wall plug becomes the sun."]},"architecture":{"summary":"A PC orchestrates an ESP32 controller. The controller writes charge into chosen wells of a 24-well plate through platinum electrodes; every well connects to one shared counter-electrode reservoir through its own salt bridge. Each well holds an electrolyte, a phosphate buffer and a pH indicator. A camera above a light pad reads every well at once; later, fibers read single wells into a spectral sensor. Analysis and the trained readout run in Python on the PC.","layers":[["L0 Host","PC (Linux or Windows), Python 3.10+","Runs experiments, camera capture, digital twin, analysis, proofs; git holds everything."],["L1 Controller","ESP32 DevKit V1 (classic WROOM-32)","Relays, coulomb counting (ADS1115), spectral reads (AS7341), DAC sweeps for diode I-V, temperature, power."],["L2 Electro-fluidic","24-well plate, printed lid, Pt working electrodes, agar salt bridges, counter reservoir","Delivers charge into a well and closes the circuit through ions, not wires."],["L3 Chemistry","50 mM sodium sulfate + borax (neurons) or phosphate (calibration) + bromothymol blue (+ phenol red)","Buffer = threshold, indicator = output, electrode charge = weighted input."],["L4 Optics","LED light pad, webcam with locked exposure, PMMA fiber + AS7341","Absorbance per well per color channel; fiber reaches wells a camera cannot see."],["L5 Power","9 V adapter, then 6 V solar panel + 18650 + boost converters","Energy per operation measured with an INA219."]],"signal_flow":["Input bits","Charge doses (mC)","H+ or OH- (Faraday's law)","Buffer absorbs until capacity runs out","Indicator flips color past the threshold","Camera / fiber absorbance","Linear readout or linear relay to the next layer"],"pinmap":[["GPIO21 / GPIO22","I2C SDA / SCL","ADS1115 #1 (0x48, shunt), ADS1115 #2 (0x49, diode I-V), AS7341 (0x39), INA219 (0x40)"],["GPIO25 / GPIO26","DAC1 / DAC2","Diode cell drive, differential: V = DAC1 - DAC2"],["GPIO16","Relay CH1","Master enable (connects +9 V through the 470 ohm limit resistor)"],["GPIO17","Relay CH2 + CH3 (both IN pins)","Polarity pair. Off = ACID write (well electrode is anode). On = BASE write."],["GPIO18, 19, 23, 32, 33","Relay CH4..CH8","Well select W1..W5 (only one on at a time, enforced in firmware)"],["GPIO13","MOSFET module #1","Vibration mixer (coin motor on the plate frame)"],["GPIO14","MOSFET module #2","External fiber LED for differential spectral reads"],["GPIO4","OneWire + 4.7 kohm pull-up to 3.3 V","DS18B20 temperature probe in the counter reservoir"],["GPIO2","On-board LED","Busy indicator"]],"wiring_notes":["Relay board: remove the JD-VCC jumper. Feed VCC (optocoupler side) from 3.3 V and JD-VCC (coils) from 5 V. Otherwise a 3.3 V HIGH may not turn a channel fully off.","Polarity pair from two SPDT relays: Relay A COM to the working bus, A-NC to the supply node S, A-NO to the return node R. Relay B COM to the counter electrode, B-NC to R, B-NO to S.","Each well relay: COM to the working bus, NO to that well's platinum electrode.","Return node R goes through the 100 ohm shunt to ground. ADS1115 #1 reads A0 (top of shunt) minus A1 (ground). The shunt never leaves ground potential, so the ADC is always safe.","Put a 250 mA fuse right after the 9 V adapter. Liquids and power share a bench; the fuse is not optional.","Diode cell: DAC1 to a 1 kohm sense resistor to electrode A; electrode B to DAC2. ADS1115 #2 reads A0-A1 across the resistor and A2-A3 across the cell."],"decisions":[["24-well plate before custom chambers","Standard footprint, clear bottoms, cheap. Custom resin chambers come after the chemistry works."],["Platinum working electrodes","Graphite flakes and steel dissolves when used as an anode; both would contaminate the optics. Graphite is fine for the counter electrode, which sits in a separate reservoir."],["Sodium sulfate electrolyte, never chloride","Chloride at an anode makes chlorine. Sulfate is inert and safe."],["Shared counter reservoir via salt bridges","Without separating the counter electrode, the acid and base you make cancel inside the same well."],["Relays, not transistors, for routing","Slow is fine (doses take seconds); relays isolate completely and forgive wiring mistakes."],["Bromothymol blue for neurons, plus phenol red for XOR","One indicator gives a clean threshold. Two indicators with different pKa give a curved color path, which a linear readout needs for XOR."],["Borax buffer for neurons, phosphate for calibration","Borax buffers near pH 9.2, well above the indicator's color change at 7.1, so the well stays blue until the buffer is used up and then flips sharply. Phosphate (pKa 7.2) sits on the color change and smooths it, which is what we want for calibration and not for thresholds."],["Webcam first, fiber second","The camera reads all wells at once to develop the chemistry; fiber is the upgrade for buried layers."]]},"methods":[["Session IDs","Every bench session gets an ID like 20261005-a. Raw files go to data/raw/<session>/ and are never edited."],["Randomized layouts","The scripts assign which well gets which condition. You follow the printed map. This stops position effects from faking a result."],["Reference wells","Wells A1 (acid reference, pH 4) and A2 (base reference, pH 9.5) sit on every plate. Each read is normalized to them, which cancels lamp and camera drift."],["Replicates","Minimum three repeats for any calibration point; 48 wells for classification claims; 40 trials for the stack."],["Statistics","Accuracy with a 95% Wilson interval; 1000-shuffle permutation test for classification; logistic fits for thresholds; R-squared for calibrations."],["Controls","Raw-input linear baseline, single-indicator control, shuffled labels, undoped gel, reverse polarity. Listed per gate."],["Temperature","Log reservoir temperature on every run. Indicator pKa shifts with temperature; a 5 C change is visible."],["Version control","Commit after every session. Tag each passed gate (git tag G3-pass). Proof JSON files live in proofs/."],["Photos","Photograph every build step and every gate result, and upload it to the step in the workspace."],["When a gate fails","Stop. Record the numbers. Work the troubleshooting list for that gate. Ask in the workspace with your data attached before changing two things at once."]],"safety":[["Eyes","Safety glasses on whenever liquids or powders are open. UV glasses for any 365 nm LED work."],["Hands","Nitrile gloves for indicators, phosphate, bisulfate, chitosan and bleach."],["Never mix bleach with acid","Bleach is used only to coat silver wire, in its own labeled jar, rinsed off before the wire touches anything else. Bleach plus acid (including vinegar, citric acid, sodium bisulfate) releases chlorine gas."],["No chloride in electrolysis cells","Sodium sulfate only in the platinum cells. Chloride at a platinum anode makes chlorine. The one exception is the diode test (P6), where Ag/AgCl electrodes need dilute salt and the silver reacts first."],["Low voltage only","12 V DC maximum on the bench, fused at 250 mA. No mains-powered device sits where a spill can reach it."],["Electrolysis gas","Currents are a few milliamps, so hydrogen and oxygen volumes are tiny. Keep the area ventilated and never seal a running cell airtight."],["Hot agar and agarose","Microwave in 15 s bursts with a loose cover; superheated gel can boil over. Use heat-resistant gloves."],["Lithium cells","Protected 18650 cells from a reputable seller only. Charge in a fireproof bag, never unattended."],["Kitchen separation","Dedicated labware only. Nothing from the lab returns to food use. Label every bottle with contents, concentration and date."],["Waste","Neutralize to pH 6-8 and flush small indicator and salt solutions with plenty of water, if your municipal rules allow. Silver and gel waste go to solid waste in a sealed bag."],["Kids and pets","The bench is off-limits when chemicals are out. Store stocks closed and high."]],"recipes":[["100 mM phosphate, pH 7.6 (100 mL)","7.1 mmol disodium phosphate + 2.9 mmol monosodium phosphate, water to 100 mL. Masses by the form on your label: Na2HPO4 anhydrous 1.01 g, dihydrate 1.26 g, heptahydrate 1.90 g, dodecahydrate 2.54 g; NaH2PO4 anhydrous 0.35 g, monohydrate 0.40 g, dihydrate 0.45 g. Check with the pH meter; nudge with drops of carbonate or bisulfate."],["Cell medium (per 100 mL)","0.71 g sodium sulfate (50 mM), phosphate stock for the buffer level you need (1 mL per 1 mM), 6.25 mL bromothymol blue stock (40 uM), water to 100 mL. Used for calibration (P3)."],["100 mM borate stock (100 mL)","0.953 g borax (sodium tetraborate decahydrate) in water to 100 mL. It buffers itself at pH 9.2; no adjustment needed. Gloves; do not ingest."],["Neuron medium (per 100 mL)","0.71 g sodium sulfate, borate stock for the level you need (1 mL per 1 mM total borate), 6.25 mL bromothymol blue stock, water to 100 mL. Deep blue at the start."],["Bromothymol blue stock 0.4 mg/mL","40 mg in 5 mL isopropyl alcohol, + 90 mL water, carbonate drops until blue-green, to 100 mL."],["Phenol red stock 0.2 mg/mL","20 mg in 5 mL isopropyl alcohol, + 90 mL water, carbonate drops until red, to 100 mL."],["Salt bridge gel","2 g agar in 100 mL of 0.25 M sodium sulfate (3.55 g anhydrous). Heat until clear."],["Counter reservoir","100 mL of 0.25 M sodium sulfate in a beaker, graphite rod, temperature probe."],["Reference wells","A1: cell medium + 50 uL of 200 mM bisulfate (pH about 4). A2: cell medium + 50 uL of 0.1 M carbonate (pH about 9.5)."]],"phases":[{"id":"P0","title":"Bench, safety and calibration","weeks":"Week 1","goal":"A safe, calibrated, documented bench and a working software environment.","why":"Every later number depends on pipette volumes, a clean bench and the digital twin running. Ten careful hours here save weeks.","hypotheses":[],"steps":[{"id":"P0.1","title":"Inventory against the BOM","detail":"Open the BOM tab. Mark each item Have, Ordered or Need. Photograph your on-hand electronics and printers.","photo":true},{"id":"P0.2","title":"Set up the bench","detail":"Choose a surface away from food prep. Lay the silicone mat or spill tray. Place the waste jar, wash bottle of distilled water, gloves and glasses within reach. Photograph the bench.","photo":true},{"id":"P0.3","title":"Install the software","detail":"Unzip the repo (or clone your GitHub copy). In a terminal at the repo root: python -m venv .venv, activate it (Windows: .venv\\Scripts\\activate, Linux: source .venv/bin/activate), then pip install -e . and run the full digital twin. It takes about a minute and must end with Self-test PASSED.","cmd":"python -m wetstack selftest --sim"},{"id":"P0.4","title":"Check the scale","detail":"Weigh the calibration weight that came with the scale three times. All three readings should be within 0.005 g of the stated value. Tare between readings."},{"id":"P0.5","title":"Calibrate the 1000 uL pipette","detail":"Set 1000 uL. Tare a small beaker. Dispense distilled water ten times, recording the scale after each (1 mg equals 1 uL at room temperature). Enter the ten cumulative readings when the script asks.","cmd":"python -m wetstack g0-pipette --volume 1000"},{"id":"P0.6","title":"Calibrate the 100 uL pipette","detail":"Same method at 100 uL, ten dispenses.","cmd":"python -m wetstack g0-pipette --volume 100"},{"id":"P0.7","title":"Read the safety rules and sign off","detail":"Read the Safety tab top to bottom. Tick this step only when every rule is set up physically (bleach jar labeled, fuse on hand, glasses at the bench)."}],"gate":{"id":"G0","name":"Bench certified","cmd":"python -m wetstack gate G0","criteria":[{"key":"pip1000_err_pct","label":"1000 uL mean error","unit":"%","op":"<=","value":3},{"key":"pip1000_cv_pct","label":"1000 uL repeatability (CV)","unit":"%","op":"<=","value":2},{"key":"pip100_err_pct","label":"100 uL mean error","unit":"%","op":"<=","value":3},{"key":"pip100_cv_pct","label":"100 uL repeatability (CV)","unit":"%","op":"<=","value":2},{"key":"selftest_pass","label":"Digital twin self-test passes","unit":"","op":"==","value":1},{"key":"safety_signed","label":"Safety rules set up and signed","unit":"","op":"==","value":1}],"if_fail":["Pipette error high: pre-wet the tip twice, dispense against the beaker wall, hold the pipette vertical, check the tip seats fully.","Error still high but CV low: the pipette is consistently off; use the measured factor as a correction in config/lab.json.","Self-test fails: run python -m wetstack selftest --sim --verbose and paste the output into Ask."]},"achievement":"Bench certified"},{"id":"P1","title":"Eyes: the optical readout bench","weeks":"Weeks 1-2","goal":"Read the color of every well reliably as absorbance.","why":"If the readout drifts or saturates, no chemistry result can be trusted. We prove the eyes before we trust what they see.","hypotheses":[{"id":"H1","text":"With locked exposure and reference-well normalization, red-channel absorbance of a bromothymol blue dilution series in base is linear in concentration (Beer-Lambert), and repeated reads vary by under 2%.","pass":"R-squared >= 0.98; repeat CV <= 2%; 10-minute drift <= 1%.","control":"A water-only well reads under 0.05 absorbance (the plastic and meniscus)."}],"steps":[{"id":"P1.1","title":"Print the plate frame","detail":"Measure your 24-well plate with calipers (outer length and width, well pitch, A1 center offset). Enter them at the top of hardware/scad/plate_frame.scad and plate_lid.scad. Print the frame in PETG, 0.2 mm layers.","photo":true},{"id":"P1.2","title":"Build the light station","detail":"Light pad flat on the bench, frame taped onto it, camera on the overhead arm about 30 cm above, lens centered over the plate. Surround with black foam board so room light cannot reach the plate. Photograph it.","photo":true},{"id":"P1.3","title":"Lock the camera","detail":"Run the camera tool. It tries to turn off auto exposure, auto white balance and autofocus. If your camera ignores it, set those manually in the camera app (Windows: Logitech G HUB or the Camera app's pro mode; Linux: v4l2-ctl or guvcview), then rerun.","cmd":"python -m wetstack camera --lock --preview"},{"id":"P1.4","title":"Mark the wells","detail":"Put the empty plate in the frame. Click the center of each well A1 to D6 in order, then click a bare spot of the light pad as the white reference. ROIs save to config/rois.json.","cmd":"python -m wetstack calibrate-rois"},{"id":"P1.5","title":"Make the bromothymol blue stock (0.4 mg/mL)","detail":"Gloves and glasses. Weigh 40 mg bromothymol blue. Dissolve in 5 mL isopropyl alcohol in a small beaker. Add 90 mL distilled water. Add 0.1 M sodium carbonate drop by drop, swirling, until the solution turns blue-green. Top up to 100 mL. Label it and store it dark.","photo":true},{"id":"P1.6","title":"Make 0.1 M sodium carbonate","detail":"1.06 g anhydrous sodium carbonate (or 2.86 g of the decahydrate washing-soda crystals) in water to 100 mL. Label it."},{"id":"P1.7","title":"Run the dilution series","detail":"The script prints a randomized map: six concentrations of indicator (0 to 100 uM) in 1 mL of 10 mM sodium carbonate, three wells each, plus water blanks. Pipette to the map, place the plate, press Enter.","cmd":"python -m wetstack g1-linearity"},{"id":"P1.8","title":"Stability run","detail":"Leave the plate in place. The script reads every minute for 10 minutes and reports drift.","cmd":"python -m wetstack g1-linearity --stability"}],"gate":{"id":"G1","name":"First light","cmd":"python -m wetstack gate G1","criteria":[{"key":"r2_dilution","label":"Dilution series linearity (R-squared)","unit":"","op":">=","value":0.98},{"key":"read_cv_pct","label":"Repeat-read variation (CV)","unit":"%","op":"<=","value":2},{"key":"drift_pct_10min","label":"Drift over 10 minutes","unit":"%","op":"<=","value":1},{"key":"blank_abs","label":"Water blank absorbance (plastic + meniscus)","unit":"","op":"<=","value":0.05}],"if_fail":["Curve bends over at high concentration: the camera is saturating or the light pad is too bright. Dim the pad or shorten exposure.","High CV: auto exposure is still on, or the plate moves. Re-lock and tape the frame.","Drift: the light pad is warming up. Switch it on 15 minutes before reading."]},"achievement":"First light"},{"id":"P2","title":"First nonlinearity: manual XOR","weeks":"Week 2","goal":"Prove that indicator chemistry creates a nonlinearity a linear readout can use.","why":"This is the core claim of the whole project in its simplest form, done by hand before any electronics touch the liquid.","hypotheses":[{"id":"H2","text":"With two indicators of different pKa (bromothymol blue and phenol red), the absorbance features of a well separate XOR(acid, base) linearly.","pass":"Logistic regression on absorbance >= 95% accuracy (5-fold cross-validation, 48 wells); permutation p <= 0.01.","control":"The same classifier on the raw inputs reaches at most 75% (mathematical maximum for XOR). A bromothymol-blue-only plate also stays at or below 80%."}],"steps":[{"id":"P2.1","title":"Make the phenol red stock (0.2 mg/mL)","detail":"20 mg phenol red in 5 mL isopropyl alcohol, add 90 mL water, a few drops of 0.1 M carbonate until red, top to 100 mL. If you bought a ready solution, note its concentration."},{"id":"P2.2","title":"Make the input stocks","detail":"Acid A: 20 mM sodium bisulfate (0.24 g anhydrous NaHSO4 per 100 mL; check the pool product label says 93% or more). Base B: start at 20 mM sodium carbonate (0.212 g per 100 mL)."},{"id":"P2.3","title":"Balance the inputs","detail":"In one well: 1 mL medium (below) plus 50 uL A plus 50 uL B. If it is not the same green as a well with nothing added, adjust B's concentration and repeat. Record the final B concentration. Balanced inputs make 'both' look like 'neither', which is what makes the task XOR.","photo":true},{"id":"P2.4","title":"Make the XOR medium","detail":"Per 100 mL: 0.71 g sodium sulfate, 1 mL of 100 mM phosphate pH 7.6 (recipe in Materials), 6.25 mL bromothymol blue stock, 2.5 mL phenol red stock, water to 100 mL."},{"id":"P2.5","title":"Run the dual-indicator plates","detail":"Two plates, 24 wells each, follow the randomized map. Each well gets 1 mL medium, then 50 uL A or water, then 50 uL B or water. Tap gently to mix, wait 2 minutes, read.","cmd":"python -m wetstack g2-xor-manual --plates 2","photo":true},{"id":"P2.6","title":"Run the single-indicator control plate","detail":"Same procedure with medium that has bromothymol blue only. This plate should fail.","cmd":"python -m wetstack g2-xor-manual --plates 1 --control single-indicator"}],"gate":{"id":"G2","name":"First XOR","cmd":"python -m wetstack gate G2","criteria":[{"key":"xor_acc_dual","label":"XOR accuracy, dual indicator","unit":"","op":">=","value":0.95},{"key":"xor_acc_raw_linear","label":"Raw-input linear baseline (must stay low)","unit":"","op":"<=","value":0.75},{"key":"xor_acc_single","label":"Single-indicator control (must stay low)","unit":"","op":"<=","value":0.8},{"key":"perm_p","label":"Permutation test p-value","unit":"","op":"<=","value":0.01},{"key":"n_wells","label":"Wells in the dual-indicator set","unit":"","op":">=","value":48}],"if_fail":["Dual accuracy low because 'both' wells are not green: rebalance B (step P2.3).","Single-indicator control passes: the classifier is using brightness, not absorbance. Check that you ran the current code.","Accuracy low with clean colors: read too soon. Wait 5 minutes for CO2 bubbles to clear."]},"achievement":"First XOR"},{"id":"P3","title":"Electric write: the Faraday cell","weeks":"Weeks 3-4","goal":"Write chemistry with electrons, and prove that charge in maps to acid made.","why":"From here on, inputs are electrical. Faraday's law (96,485 coulombs per mole) is our calibration constant.","hypotheses":[{"id":"H3a","text":"Coulomb counting delivers the requested charge within 2%.","pass":"Mean absolute error <= 2% versus a multimeter in series.","control":"Zero-charge dose reads under 0.05 mC."},{"id":"H3b","text":"Faradaic efficiency (acid made divided by charge/F) is at least 70% at the platinum anode in sulfate.","pass":"Efficiency >= 0.70, dose-response CV <= 5% over 3 repeats.","control":"Pipetted sodium bisulfate standards define the color-to-moles curve."}],"steps":[{"id":"P3.1","title":"Build the controller","detail":"Breadboard first, following the pin map and wiring notes in the Architecture tab. Relay JD-VCC jumper removed. Fuse after the 9 V adapter. Photograph it before powering.","photo":true},{"id":"P3.2","title":"Flash the firmware","detail":"Arduino IDE 2.x: install the esp32 board package (Espressif), and libraries Adafruit ADS1X15, Adafruit AS7341, Adafruit INA219, OneWire, DallasTemperature. Open firmware/wetstack_ctl/wetstack_ctl.ino, select ESP32 Dev Module, upload. Then ping it.","cmd":"python -m wetstack ping --port COM5"},{"id":"P3.3","title":"Dry test the relays","detail":"No liquids. Run the relay test; you should hear each relay click in turn and see PASS for the interlock.","cmd":"python -m wetstack relay-test"},{"id":"P3.4","title":"Print and fit the lid","detail":"Print hardware/scad/plate_lid.scad in PETG with the wells you will use (default A3, A4, A5, A6, B3). Check every hole with the wire and tubing before going further.","photo":true},{"id":"P3.5","title":"Make the electrodes","detail":"Cut 5 platinum pieces of 18 mm. Crimp or tightly wrap each onto a copper lead, cover the joint with heat-shrink and a dab of epoxy so only platinum touches liquid. Push through the lid so 6 mm sits in the well. Counter electrode: a 2 mm graphite rod in the reservoir beaker.","photo":true},{"id":"P3.6","title":"Verify the platinum","detail":"Anodic test: one electrode in 50 mM sodium sulfate, 3 mA for 10 minutes. Real platinum stays bright and the liquid stays clear. Discoloration means the wire is fake; switch to graphite and tell me."},{"id":"P3.7","title":"Make salt bridges","detail":"Heat 2 g agar in 100 mL of 0.25 M sodium sulfate (3.55 g) until clear. Draw into 2 mm silicone tubing with a syringe, no bubbles. Let set 20 minutes. Cut 70 mm lengths, bend into a U, one end in a well, one in the reservoir (100 mL beaker, 0.25 M sodium sulfate).","photo":true},{"id":"P3.8","title":"Calibrate coulomb counting","detail":"Multimeter in series on the mA range. Run doses of 5, 10, 20 and 40 mC into a well of plain sulfate; type the multimeter's steady current when asked.","cmd":"python -m wetstack g3-faraday --charge-cal"},{"id":"P3.9","title":"Standards and dose response","detail":"The script maps pipetted bisulfate standards (0-0.8 umol acid, 10 mM stock topped to 120 uL with water) and twelve 6 mC electrical doses in W1 (1 mL of 1 mM phosphate cell medium + 120 uL water), mixing 10 s after each dose. Efficiency is fitted only where the standards still change color. Three repeats; refill W1 between them.","cmd":"python -m wetstack g3-faraday"}],"gate":{"id":"G3","name":"First electric write","cmd":"python -m wetstack gate G3","criteria":[{"key":"charge_err_pct","label":"Charge delivery error","unit":"%","op":"<=","value":2},{"key":"faradaic_eff","label":"Faradaic efficiency","unit":"","op":">=","value":0.7},{"key":"dose_cv_pct","label":"Dose-response repeatability (CV)","unit":"%","op":"<=","value":5}],"if_fail":["Charge error high: the shunt is not 100 ohm. Measure it and set shunt_ohm in config/lab.json.","Current far below 2 mA: a salt bridge has a bubble or dried out. Remake it.","Low efficiency: dissolved oxygen is being reduced, or the platinum is fake. Run P3.6 again.","Poor repeatability: mixing is incomplete. Increase mix time to 20 s or move the motor closer."]},"achievement":"First electric write"},{"id":"P4","title":"The chemical neuron: threshold and reset","weeks":"Weeks 4-5","goal":"Show that buffer sets a tunable firing threshold, and that reverse charge resets the well for 100+ cycles.","why":"A neuron is a weighted sum, a threshold and a reset. Charge is the weighted sum; buffer capacity is the threshold; reverse charge is the reset.","hypotheses":[{"id":"H4","text":"Response versus charge is sigmoidal, and its midpoint Q50 scales linearly with borax buffer concentration.","pass":"Q50 versus buffer R-squared >= 0.95 over 0.5, 1, 2 and 4 mM total borate; 10-90% width <= 40% of Q50.","control":"A well with no buffer fires at under 10% of the 1 mM Q50."},{"id":"H5","text":"Writing acid then the same charge of base returns the well to baseline, with no fluid added, for 100 cycles.","pass":"Baseline absorbance shift <= 0.02 after reset; Q50 drift <= 10% from cycle 1 to 100.","control":"An unwritten neighbor well tracks background drift."}],"steps":[{"id":"P4.1","title":"Make neuron media","detail":"Neuron medium (recipe in Materials) at 0, 0.5, 1, 2 and 4 mM total borate: 0, 0.5, 1, 2 and 4 mL of the 100 mM borate stock per 100 mL. The 0 mM control gets a trace of carbonate until blue-green."},{"id":"P4.2","title":"Threshold sweep","detail":"One buffer level per electrode well, 1 mL each. The script doses in steps, mixes, reads, and fits a sigmoid per well.","cmd":"python -m wetstack g4-threshold","photo":true},{"id":"P4.3","title":"Overnight reset run","detail":"1 mM borate well: 100 cycles of acid at 1.5 x Q50, read, equal base, read. Lid on to slow CO2 uptake. Check the bridge ends are submerged before you leave it.","cmd":"python -m wetstack g4-reset --cycles 100"}],"gate":{"id":"G4","name":"First chemical neuron","cmd":"python -m wetstack gate G4","criteria":[{"key":"q50_buffer_r2","label":"Q50 vs buffer linearity","unit":"","op":">=","value":0.95},{"key":"width_ratio","label":"Threshold sharpness (width / Q50)","unit":"","op":"<=","value":0.4},{"key":"reset_delta_abs","label":"Baseline shift after reset","unit":"","op":"<=","value":0.02},{"key":"cycle_drift_pct","label":"Q50 drift over the run","unit":"%","op":"<=","value":10},{"key":"cycles","label":"Write/reset cycles completed","unit":"","op":">=","value":100}],"if_fail":["Thresholds not linear in borate: carbon dioxide from air is adding acid and buffer. Keep the lid on and use freshly made medium.","Reset drifts acid-ward: the counter reservoir has drifted. Replace the reservoir solution (not the wells) and rerun.","Indicator fades: bromothymol blue oxidizing at the anode. Lower current to 1.5 mA and report it."]},"achievement":"First chemical neuron"},{"id":"P5","title":"Logic and the first stack","weeks":"Weeks 5-6","goal":"Single chemical neurons compute AND and OR; a two-layer chemical network computes XOR.","why":"XOR is the classic task one threshold unit cannot do. Doing it with two layers of chemistry, relayed only linearly, is the MVP's headline proof.","hypotheses":[{"id":"H6a","text":"Buffer level alone turns one neuron into AND or OR.","pass":"Truth tables correct in 10 of 10 repeats each.","control":"Unbuffered well fires on any input (OR at best, never AND)."},{"id":"H6b","text":"OR neuron (excitatory) and AND neuron (inhibitory) feed an output neuron that computes XOR, with the relay purely linear.","pass":"XOR accuracy >= 95% over >= 40 randomized trials; relay code audited linear.","control":"Same network with the inhibitory link cut computes OR, not XOR."}],"steps":[{"id":"P5.1","title":"Find the AND and OR buffer levels","detail":"From your G4 fits, the script proposes borate levels so one input dose crosses threshold (OR) or only two do (AND), and an output neuron level. Make those three media.","cmd":"python -m wetstack g5-logic --plan"},{"id":"P5.2","title":"Truth tables","detail":"Wells W1 = OR, W2 = AND. Each input row is dosed, mixed, read and reset, ten times.","cmd":"python -m wetstack g5-logic --truth"},{"id":"P5.3","title":"Wire the stack","detail":"W3 is the output neuron. Layer 2 dose = gain x layer-1 signal (acid for OR, base for AND). Gains are fixed after calibration and saved to config.","cmd":"python -m wetstack g5-stack --calibrate"},{"id":"P5.4","title":"Run 40 randomized trials","detail":"Expect about two hours. Photograph the plate at one trial of each input combination.","cmd":"python -m wetstack g5-stack --trials 40","photo":true},{"id":"P5.5","title":"Cut-link control","detail":"Same run with the AND-to-output gain set to zero. It should compute OR.","cmd":"python -m wetstack g5-stack --trials 16 --cut-inhibition"}],"gate":{"id":"G5","name":"First stack","cmd":"python -m wetstack gate G5","criteria":[{"key":"and_acc","label":"AND truth table accuracy","unit":"","op":">=","value":1.0},{"key":"or_acc","label":"OR truth table accuracy","unit":"","op":">=","value":1.0},{"key":"stack_xor_acc","label":"Stacked XOR accuracy","unit":"","op":">=","value":0.95},{"key":"stack_trials","label":"Randomized trials","unit":"","op":">=","value":40},{"key":"linear_relay","label":"Relay audited linear","unit":"","op":"==","value":1}],"if_fail":["AND fires on one input: buffer too low; raise by 20%.","XOR fails on input 1,1: inhibitory gain too small; it must be at least the excitatory gain.","Errors cluster late in the run: reset ledger drift. Re-zero by running g4-reset --cycles 1 between blocks."]},"achievement":"First stack"},{"id":"P6","title":"Junctions: the ionic diode","weeks":"Weeks 6-7","goal":"Build a hydrogel junction that conducts ions better in one direction, from home-sourced polymers.","why":"Directional junctions are what let signals rise through stacked layers instead of echoing back.","hypotheses":[{"id":"H7","text":"A bipolar junction of cationic gel (agarose + chitosan) against anionic gel (agarose + alginate) rectifies ion current.","pass":"Median rectification ratio >= 2 at +/-2.5 V over 3 devices.","control":"Plain agarose tube: ratio <= 1.2."},{"id":"H7b","text":"Under a slow sine drive the junction shows a pinched hysteresis loop (memory).","pass":"Visible pinched loop on the oscilloscope in X-Y mode at 0.1 Hz.","control":"1 kohm resistor shows a straight line."}],"steps":[{"id":"P6.1","title":"Make Ag/AgCl electrodes","detail":"In the labeled bleach jar only: 5 cm pieces of silver wire, 30 minutes in plain household bleach until dark purple-gray. Rinse well in distilled water. Never let bleach meet acid.","photo":true},{"id":"P6.2","title":"Cationic gel","detail":"Dissolve 1 g chitosan in 50 mL of 1% acetic acid (10 mL white vinegar + 40 mL water), stir until clear (hours; hotplate low). Mix 1:1 with hot 3% agarose in water to get 1.5% agarose / 1% chitosan."},{"id":"P6.3","title":"Anionic gel","detail":"1.5% agarose with 1% sodium alginate in water. Backup: swollen sodium polyacrylate paste."},{"id":"P6.4","title":"Cast three diode tubes and one control","detail":"40 mm of 3 mm silicone tube. Fill 20 mm with warm cationic gel by syringe, let set 10 minutes, then fill the rest with warm anionic gel pressed against it. Control: plain 1.5% agarose. Label the ends + (cationic) and - (anionic).","photo":true},{"id":"P6.5","title":"I-V sweeps","detail":"Each tube bridges two wells holding 10 mM table salt (58 mg non-iodized salt per 100 mL), one Ag/AgCl wire per well. Ag/AgCl needs chloride to work; silver reacts long before any chlorine could form at these voltages. 2 s dwell per step.","cmd":"python -m wetstack g6-diode --devices 3 --control 1"},{"id":"P6.6","title":"Hysteresis on the scope","detail":"Scope X on the cell voltage, Y across the 1 kohm sense resistor, X-Y mode. Run the sine drive and photograph the screen.","cmd":"python -m wetstack g6-diode --sine 0.1","photo":true}],"gate":{"id":"G6","name":"First diode","cmd":"python -m wetstack gate G6","criteria":[{"key":"rr_median","label":"Median rectification ratio","unit":"","op":">=","value":2.0},{"key":"rr_control","label":"Plain-gel control ratio","unit":"","op":"<=","value":1.2},{"key":"devices","label":"Devices measured","unit":"","op":">=","value":3}],"if_fail":["Ratio near 1: the interface has an air gap. Recast pressing the second gel firmly against the first.","Ratio drifts during the sweep: dwell too short; set 5 s.","Still low: try the polyacrylate backup or the calcium exchange stretch step and tell me the numbers."]},"achievement":"First diode"},{"id":"P7","title":"Fiber eyes","weeks":"Weeks 7-8","goal":"Read a well through optical fiber into a spectral sensor as well as the camera does, including where the camera cannot see.","why":"Stacked layers bury chambers. Fiber is how we keep reading them.","hypotheses":[{"id":"H9","text":"LED-on minus LED-off fiber reads track camera absorbance across a dose sweep.","pass":"R-squared >= 0.95; with the plate covered, noise <= 3%.","control":"Fiber in an empty well reads constant."}],"steps":[{"id":"P7.1","title":"Print fiber parts","detail":"hardware/scad/fiber_parts.scad: the lid with a center fiber port, the LED coupler and the sensor cap. Clear resin or PETG, fully cured and washed.","photo":true},{"id":"P7.2","title":"Cut and polish fiber","detail":"Cut 1 mm PMMA fiber with a fresh hot blade, polish each end on 2000-grit wet paper in figure-eights for 30 seconds."},{"id":"P7.3","title":"Assemble and read","detail":"Light pad below, fiber tip 2 mm above the liquid, far end in the sensor cap on the AS7341.","cmd":"python -m wetstack spec --diff"},{"id":"P7.4","title":"Dose sweep with both readers","cmd":"python -m wetstack g7-fiber","detail":"Camera and fiber read the same well through a dose sweep, then again with a dark cover over the plate (camera blinded)."}],"gate":{"id":"G7","name":"Fiber eyes","cmd":"python -m wetstack gate G7","criteria":[{"key":"fiber_camera_r2","label":"Fiber vs camera agreement","unit":"","op":">=","value":0.95},{"key":"fiber_blind_noise_pct","label":"Fiber noise with camera blinded","unit":"%","op":"<=","value":3}],"if_fail":["Weak signal: polish the fiber ends again, and raise AS7341 gain.","Noisy: room light leaking; use the differential mode and the sensor cap."]},"achievement":"Fiber eyes"},{"id":"P8","title":"Sun power and energy per operation","weeks":"Weeks 8-9","goal":"Run the controller and dosing from sunlight and measure joules per chemical operation.","why":"Low power and minimal consumables were the goal from the start. This is where we put numbers on it.","hypotheses":[{"id":"H10","text":"A 6 V panel with a single 18650 buffer runs a 4-hour daylight session of 100+ writes without a brownout.","pass":">= 4 h, >= 100 writes, 0 brownouts; joules per write recorded.","control":"Same session on the wall adapter gives the same dose accuracy."}],"steps":[{"id":"P8.1","title":"Build the power board","detail":"Panel to CN3791 charger to protected 18650. Battery to INA219 to two MT3608 boosts: set one to 5.0 V (ESP32 5V pin) and one to 9.0 V (electrolysis supply) with the multimeter before connecting anything.","photo":true},{"id":"P8.2","title":"Daylight session","cmd":"python -m wetstack g8-solar --hours 4","detail":"Panel in a window or outside in shade-free light. The script cycles the 1 mM neuron and logs power."}],"gate":{"id":"G8","name":"Sun-powered","cmd":"python -m wetstack gate G8","criteria":[{"key":"solar_hours","label":"Session length","unit":"h","op":">=","value":4},{"key":"writes","label":"Writes completed","unit":"","op":">=","value":100},{"key":"brownouts","label":"Brownouts","unit":"","op":"==","value":0},{"key":"j_per_write","label":"Energy per write","unit":"J","op":"record","value":0}],"if_fail":["Brownout at relay switching: add 470 uF across the 5 V rail.","Energy per write dominated by relay coils (about 75 mW each while held): switch to latching relays or MOSFET routing for WetStack-1. The twin predicts this.","Battery drains: panel too small for continuous dosing; lengthen idle time between writes."]},"achievement":"Sun-powered"},{"id":"P9","title":"MVP integration","weeks":"Week 10","goal":"Run the whole system in one demonstration and publish the report.","why":"Each gate proved a part. The MVP proves the parts work together.","hypotheses":[],"steps":[{"id":"P9.1","title":"Full demo run","detail":"Solar powered; stacked XOR with camera and fiber readout; the diode tube installed as W3's bridge; 20 trials.","cmd":"python -m wetstack mvp-demo --trials 20","photo":true},{"id":"P9.2","title":"Generate the report","cmd":"python -m wetstack report","detail":"Collects every proof file into docs/MVP_REPORT.md. Commit, then git tag v1.0-mvp."},{"id":"P9.3","title":"Debrief","detail":"Upload the report and three photos to the workspace and ask for the lab-manager review. We plan WetStack-1 from what broke."}],"gate":{"id":"G9","name":"MVP complete","cmd":"python -m wetstack gate G9","criteria":[{"key":"gates_passed","label":"Gates G0-G8 passed","unit":"","op":">=","value":9},{"key":"demo_acc","label":"Integrated demo XOR accuracy","unit":"","op":">=","value":0.9}],"if_fail":["Integrated accuracy below the stack result: compare per-trial logs for the readout path that differs."]},"achievement":"WetStack-0 MVP"}],"stretch":[["Photochromic short-term memory","UV write (365 nm via fiber), visible erase, decay time measured. Craft photochromic pigment in clear epoxy. A memory that fades on its own, like short-term memory."],["Delay neuron (iodine clock)","Vitamin C, iodine tincture, 3% peroxide, starch. Fires abruptly after a delay set by input dose: a timing element."],["Calcium-exchanged diode","Soak the anionic side in calcium chloride. Multivalent counter-ions raised a published hydrogel diode's ratio from 3 to over 70."],["Diode-coupled wells","Replace a salt bridge with a diode tube and show writes pass one way more easily than the other."],["Resin micro-chambers","96 chambers at 50 uL in clear resin; measure how dose time shrinks with volume."]],"bom":[{"id":"E01","kind":"electronics","name":"ESP32 DevKit V1 (classic ESP32-WROOM-32, 38-pin)","qty":2,"lo":6,"hi":12,"src":"AliExpress","search":"ESP32 DevKit V1 WROOM-32 38pin","phase":"P3","note":"Must be classic ESP32: S2, S3 and C3 have no DAC. Second board is a spare."},{"id":"E02","kind":"electronics","name":"ADS1115 16-bit ADC module","qty":3,"lo":3,"hi":6,"src":"AliExpress","search":"ADS1115 module 16 bit","phase":"P3","note":"One shunt, one diode I-V, one spare. Set the second to address 0x49 (ADDR to VDD)."},{"id":"E03","kind":"electronics","name":"AS7341 11-channel spectral sensor module","qty":2,"lo":14,"hi":38,"src":"AliExpress / Amazon (Adafruit)","search":"AS7341 spectral sensor module","phase":"P7","note":"Adafruit version is easiest; Ali clones work with the same library."},{"id":"E04","kind":"electronics","name":"8-channel 5 V relay module, optocoupled, with JD-VCC jumper","qty":1,"lo":7,"hi":14,"src":"AliExpress","search":"8 channel relay module 5V optocoupler","phase":"P3","note":"Low-level trigger type."},{"id":"E05","kind":"electronics","name":"INA219 current/power module","qty":2,"lo":2,"hi":6,"src":"AliExpress","search":"INA219 module","phase":"P8","note":""},{"id":"E06","kind":"electronics","name":"DS18B20 waterproof temperature probe","qty":2,"lo":2,"hi":5,"src":"AliExpress","search":"DS18B20 waterproof probe","phase":"P3","note":""},{"id":"E07","kind":"electronics","name":"Logic-level MOSFET switch module (AO3400 or D4184)","qty":3,"lo":1,"hi":3,"src":"AliExpress","search":"D4184 MOSFET module","phase":"P3","note":"Not IRF520 modules: they do not switch fully at 3.3 V."},{"id":"E08","kind":"electronics","name":"Coin vibration motors 10 mm, 3 V (10-pack)","qty":1,"lo":3,"hi":7,"src":"AliExpress","search":"coin vibration motor 1027 3V","phase":"P3","note":"Mixer."},{"id":"E09","kind":"electronics","name":"MT3608 boost converter","qty":3,"lo":1,"hi":3,"src":"AliExpress","search":"MT3608 boost module","phase":"P8","note":""},{"id":"E10","kind":"electronics","name":"9 V 1 A DC adapter + barrel jack breakout","qty":1,"lo":10,"hi":18,"src":"Amazon","search":"9V 1A power adapter 5.5x2.1","phase":"P3","note":""},{"id":"E11","kind":"electronics","name":"Inline fuse holder + 250 mA fast fuses","qty":1,"lo":5,"hi":10,"src":"Amazon","search":"inline fuse holder 5x20 250mA","phase":"P3","note":"Required."},{"id":"E12","kind":"electronics","name":"1% resistor kit (incl. 100, 470, 1k, 4.7k ohm)","qty":1,"lo":8,"hi":14,"src":"AliExpress","search":"1% metal film resistor kit","phase":"P3","note":"Verify on hand.","onhand":true},{"id":"E13","kind":"electronics","name":"Perfboard, screw terminals, headers","qty":1,"lo":8,"hi":15,"src":"AliExpress","search":"perfboard screw terminal kit","phase":"P3","note":""},{"id":"E14","kind":"electronics","name":"Breadboard and jumper wires","qty":1,"lo":8,"hi":12,"src":"AliExpress","search":"830 breadboard jumper kit","phase":"P3","note":"Verify on hand.","onhand":true},{"id":"E15","kind":"equipment","name":"Multimeter with uA/mA ranges","qty":1,"lo":25,"hi":50,"src":"Amazon","search":"auto ranging multimeter microamp","phase":"P3","note":"Verify on hand.","onhand":true},{"id":"E16","kind":"equipment","name":"Oscilloscope","qty":1,"lo":0,"hi":0,"src":"On hand","search":"","phase":"P6","note":"On hand.","onhand":true},{"id":"E17","kind":"electronics","name":"TCA9548A I2C multiplexer","qty":1,"lo":2,"hi":4,"src":"AliExpress","search":"TCA9548A module","phase":"Stretch","note":"For several AS7341 later."},{"id":"O01","kind":"equipment","name":"LED tracing light pad, A4, dimmable","qty":1,"lo":22,"hi":38,"src":"Amazon","search":"A4 LED light pad tracing dimmable","phase":"P1","note":"Even backlight for the plate."},{"id":"O02","kind":"equipment","name":"USB webcam with manual exposure (Logitech C920/C922 class)","qty":1,"lo":50,"hi":110,"src":"Amazon","search":"Logitech C920","phase":"P1","note":"Manual exposure and white balance are the requirement."},{"id":"O03","kind":"equipment","name":"Overhead camera arm / desk mount","qty":1,"lo":20,"hi":38,"src":"Amazon","search":"overhead camera desk mount arm 1/4","phase":"P1","note":""},{"id":"O04","kind":"material","name":"PMMA end-glow optical fiber, 1.0 mm, 10 m","qty":1,"lo":8,"hi":16,"src":"AliExpress","search":"PMMA optical fiber 1mm end glow","phase":"P7","note":""},{"id":"O05","kind":"electronics","name":"5 mm LED asso function check(op, got, target){
  if (got === undefined || got === null || got === "" || Number.isNaN(got)) return null;
  if (op === ">=") return got >= target;
  if (op === "<=") return got <= target;
  if (op === "==") return Math.abs(got - target) < 1e-9;
  return true;
}
function gateEval(ph){
  const vals = gateValues(ph.gate.id);
  const rows = ph.gate.criteria.map(c => ({...c, got: vals[c.key], ok: check(c.op, vals[c.key], c.value)}));
  return {rows, pass: rows.every(r => r.ok === true), met: rows.filter(r => r.ok === true).length};

    const st = bomStatus(b), paid = (state.bom[b.id] && Number(state.bom[b.id].paid)) || 0;
    spent += paid;
    if (st !== "have"){ lo += b.qty * b.lo; hi += b.qty * b.hi; open++; }
  }
  m.append(el("div", {class: "totals"},
    el("div", null, el("b", null, `${money(lo)} to ${money(hi)}`), el("span", {class: "muted small"}, `still to buy across ${open} items`)),
    el("div", null, el("b", null, money(spent)), el("span", {class: "muted small"}, "recorded as paid"))));
  const gsel = el("select", {"aria-label": "Group", onchange: e => { ui.bomGroup = e.target.value; render(); }}, Object.entries(GROUPS).map(([k, v]) => el("option", {value: k, selected: ui.bomGroup === k ? true : null}, v)));
  const phases = ["all", ...PH.map(p => p.id), "Stretch"];
  const psel = el("select", {"aria-label": "Phase", onchange: e => { ui.bomPhase = e.target.value; render(); }}, phases.map(p => el("option", {value: p, selected: ui.bomPhase === p ? true : null}, p === "all" ? "Every phase" : "Needed by " + p)));
  m.append(el("div", {class: "filters"}, gsel, psel));
  const rows = DATA.bom.filter(b => (ui.bomGroup === "all" || groupOf(b.kind) === ui.bomGroup) && (ui.bomPhase === "all" || b.phase === ui.bomPhase));
  const tb = el("tbody");
  for (const b of rows){
    const st = bomStatus(b);
    const sel = el("select", {"aria-label": "Status of " + b.name, onchange: e => { state.bom[b.id] = {...(state.bom[b.id] || {}), st: e.target.value}; touch(); render(); }},
      [["need", "Need"], ["ordered", "Ordered"], ["have", "Have"]].map(([v, l]) => el("option", {value: v, selected: st === v ? true : null}, l)));
    const paid = el("input", {type: "number", step: "0.01", min: "0", placeholder: "paid", "aria-label": "Paid for " + b.name});
    if (state.bom[b.id] && state.bom[b.id].paid) paid.value = state.bom[b.id].paid;
    paid.addEventListener("change", () => { state.bom[b.id] = {...(state.bom[b.id] || {}), paid: paid.value === "" ? null : Number(paid.value)}; touch(); render(); });
    tb.append(el("tr", {class: st},
      el("td", null, el("div", {class: "nm"}, b.name), b.note ? el("div", {class: "nt"}, b.note) : null, el("div", {class: "nt"}, b.id)),
      el("td", {class: "num"}, b.qty),
      el("td", {class: "num"}, b.hi ? `${money(b.qty * b.lo)}-${money(b.qty * b.hi)}` : "on hand"),
      el("td", null, b.src, b.search ? el("div", null, el("button", {class: "btn quiet", style: "padding:2px 8px;font-size:.8rem;margin-top:4px", onclick: () => copy(b.search)}, "Copy search")) : null),
      el("td", {class: "num"}, b.phase), el("td", null, sel), el("td", null, paid)));
  }
  m.append(el("div", {class: "scroll"}, el("table", {class: "bom"}, el("thead", null, el("tr", null, ["Item", "Qty", "Estimate", "Source", "Needed", "Status", "Paid"].map(h => el("th", null, h)))), tb)));
}

function viewMethods(m){
  m.append(el("h1", null, "Methods, safety and recipes"));
  m.append(el("h2", null, "(d) How we run experiments"), el("dl", {class: "pairs"}, DATA.methods.flatMap(([a, b]) => [el("dt", null, a), el("dd", null, b)])));
  m.append(el("p", null, DATA.sim_note));

/* ---------- Ask the lab manager ---------- */
const RULES = `You are the lab manager and instructor for WetStack-0, a home-lab electro-chemical neuron project. The person asking is your junior lab partner and does the hands-on work at a home bench.
How to answer:
- Be specific and practical: name the exact next action, the expected reading, and how to tell success from failure.
- Safety comes first. Never approve mixing bleach with any acid, chloride in the platinum electrolysis cells, more than 12 V DC on the bench, unattended lithium charging, or skipping eye protection. If a plan is unsafe, say so and give the safe alternative.
- Respect the project rules: gates are pass/fail; the linear-relay rule (electronics may only multiply a signal by a fixed gain between chemical layers); absorbance features, not raw brightness; every claim has a control.
- If a photo is attached, describe what you see that matters for this step, and say whether it looks right.
- If data are missing, ask for the specific numbers or file you need. Keep answers under about 300 words unless asked for more. Plain text, short paragraphs or numbered steps.`;
function contextFor(stepId){
  const pr = progress();
  const lines = [`Project progress: ${pr.done}/${pr.total} steps done. Gates passed: ${PH.filter(p => gateEval(p).pass).map(p => p.gate.id).join(", ") || "none"}.`];
  if (stepId !== "general" && STEP[stepId]){
    const s = STEP[stepId], ph = PH.find(p => p.id === s.phase);
    lines.push(`Current phase ${ph.id} "${ph.title}". Goal: ${ph.goal}`);
    lines.push(`Current step ${s.id} "${s.title}" (status: ${stepState(s.id)}). Instructions: ${s.detail}${s.cmd ? " Command: " + s.cmd : ""}`);
    if (notes.notes[s.id]) lines.push(`My notes on this step: ${notes.notes[s.id].slice(0, 1500)}`);
    const ev = gateEval(ph);
    lines.push(`Gate ${ph.gate.id} "${ph.gate.name}": ` + ev.rows.map(r => `${r.label} target ${r.op} ${r.value}, measured ${r.got ?? "not yet"}`).join("; "));
    for (const h of ph.hypotheses) lines.push(`Hypothesis ${h.id}: ${h.text} Pass: ${h.pass} Control: ${h.control}`);
  } else {
    const ph = PH.find(p => p.id === (state.meta.phase || "P0"));
    lines.push(`I am currently on phase ${ph.id} "${ph.title}".`);
  }
  return lines.join("\n");
}
function threadFor(stepId){ return entries.filter(e => e.kind === "qa" && (e.step || "general") === stepId).sort((a, b) => a.t - b.t); }
function viewAsk(m){
  m.append(el("h1", null, "Ask the lab manager"));
  const sel = el("select", {"aria-label": "Context", onchange: e => { ui.askStep = e.target.value; render(); }},
    el("option", {value: "general", selected: ui.askStep === "general" ? true : null}, "General question"),
    PH.map(ph => el("optgroup", {label: `${ph.id} ${ph.title}`}, ph.steps.map(s => el("option", {value: s.id, selected: ui.askStep === s.id ? true : null}, `${s.id} ${s.title}`)))));
  m.append(el("div", {class: "filters"}, el("span", {class: "muted"}, "About"), sel));
  const thread = el("div", {class: "thread"});
  const past = threadFor(ui.askStep);
  if (!past.length && !askBusy) thread.append(el("div", {class: "empty"}, "No questions on this yet. Your step, notes and gate numbers are sent along, so you can ask short questions like \"is this current normal?\""));
  for (const e of past){
    thread.append(el("div", {class: "msg me"}, el("span", {class: "who"}, new Date(e.t).toLocaleString()), e.q));
    if (e.asset) thread.append(el("img", {src: "/_blob/" + e.asset, alt: "Attached photo", style: "max-width:240px;border-radius:8px"}));
    thread.append(el("div", {class: "msg lab"}, el("span", {class: "who"}, "Lab manager"), e.a));
  }
  const live = el("div", {class: "msg lab", id: "live", style: askBusy ? "" : "display:none"}, el("span", {class: "who"}, "Lab manager"), el("span", {id: "livetext"}, askLive || "Thinking..."));
  thread.append(live);
  m.append(thread);
  const q = el("textarea", {placeholder: "What's happening, what you measured, what you want to know", "aria-label": "Question"});
  const file = el("input", {type: "file", accept: "image/jpeg,image/png,image/webp", "aria-label": "Attach a photo"});
  const send = el("button", {class: "btn solid", disabled: askBusy ? true : null}, "Send");
  const stop = el("button", {class: "btn", style: askBusy ? "" : "display:none", onclick: () => askCtl && askCtl.abort()}, "Stop");
  const copyCtx = el("button", {class: "btn quiet", onclick: () => copy(RULES + "\n\n" + contextFor(ui.askStep) + "\n\nMy question: " + q.value)}, "Copy for a claude.ai chat");
  send.addEventListener("click", () => ask(q, file));
  const compose = el("div", {class: "compose"}, q, el("div", {class: "tools"}, send, stop,
    cap.sample && cap.imagesOk ? el("label", {class: "small"}, "Photo ", file) : null, copyCtx));
  if (!cap.sample) compose.append(el("p", {class: "small muted"}, "Asking from here works in the published workspace. Here, copy the question with its context and paste it into a chat with Claude."));
  m.append(compose);
}
async function ask(q, file){
  const text = q.value.trim();
  if (!text || askBusy) return;
  if (!cap.sample){ copy(RULES + "\n\n" + contextFor(ui.askStep) + "\n\nMy question: " + text); return; }
  const stepId = ui.askStep, img = file && file.files && file.files[0] ? file.files[0] : null;
  const turns = [{role: "user", content: RULES + "\n\nProject context:\n" + contextFor(stepId)}];
  for (const e of threadFor(stepId).slice(-4)){ turns.push({role: "user", content: e.q}); turns.push({role: "assistant", content: e.a}); }
  turns.push({role: "user", content: text});
  askBusy = true; askLive = ""; askCtl = new AbortController(); render();
  try{
    const opts = {signal: askCtl.signal, cache: false, onText: ({text}) => { askLive = text; const n = document.getElementById("livetext"); if (n) n.textContent = text; }};
    if (img) opts.images = [img];
    const res = await cap.sample(turns, opts);
    let assetId = null;
    if (img && cap.assets){ try{ assetId = (await cap.assets.upload(img)).id; }catch(e){} }
    askBusy = false; askLive = "";
    await addEntry({kind: "qa", step: stepId, q: text, a: res.text + (res.truncated ? "\n\n(Answer cut short; ask for the rest.)" : ""), asset: assetId});
  }catch(e){
    askBusy = false;
    const partial = e && e.text ? e.text : "";
    askLive = "";
    const msgs = {not_granted: "Asking Claude was not allowed for this page.", rate_limited: "Too many questions right now; try again in a minute.",
      session_expired: "Sign in to claude.ai again.", refused: "That question could not be answered; rephrase it.", image_rejected: "That photo could not be read; try a JPEG under 20 MB."};
    if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) cap.sample = null;
    if (partial && e.code !== "refused") await addEntry({kind: "qa", step: stepId, q: text, a: partial + "\n\n(Interrupted.)"});
    if (!e || e.code !== "cancelled") toast(msgs[e && e.code] || "Could not reach Claude; try again.");
  }
  askCtl = null; render();
}

/* ---------- Log ---------- */
function viewLog(m){
  m.append(el("h1", null, "Lab log"));
  m.append(el("p", null, "Notes and photos from the bench, newest first. Photos attached to steps appear here too."));
  const stepSel = el("select", {"aria-label": "Step"}, el("option", {value: ""}, "No particular step"), ALLSTEPS.map(s => el("option", {value: s.id}, `${s.id} ${s.title}`)));
  const ta = el("textarea", {placeholder: "What you did, saw or measured", "aria-label": "Log entry"});
  const save = el("button", {class: "btn solid", onclick: async () => {
    if (!ta.value.trim()) return;
    await addEntry({kind: "note", step: stepSel.value || null, text: ta.value.trim()}); ta.value = ""; toast("Logged");
  }}, "Add to log");
  m.append(el("div", {class: "compose"}, el("div", {class: "filters"}, stepSel), ta, el("div", {class: "tools"}, save, uploadButton(null, "Add photo to log"))));
  const list = entries.filter(e => e.kind !== "qa").sort((a, b) => b.t - a.t);
  if (!list.length) m.append(el("div", {class: "empty", style: "margin-top:16px"}, "Nothing logged yet. Start with a photo of your bench."));
  for (const e of list){
    m.append(el("div", {class: "entry"}, el("div", {class: "small muted"}, new Date(e.t).toLocaleString() + (e.step ? `, step ${e.step}` : "")),
      e.asset ? el("img", {src: "/_blob/" + e.asset, alt: e.text || "Lab photo", loading: "lazy"}) : null,
      e.kind === "note" ? el("p", null, e.text) : el("p", {class: "small muted"}, e.text || "")));
  }
}

/* ---------- Sync ---------- */
function progressMarkdown(){
  const L = ["# WetStack-0 progress", "", `Exported ${new Date().toISOString()}`, ""];
  for (const ph of PH){
    const ev = gateEval(ph);
    L.push(`## ${ph.id} ${ph.title}`, "");
    for (const s of ph.steps){ const st = stepState(s.id); L.push(`- [${st === "done" ? "x" : " "}] ${s.id} ${s.title}${st === "doing" || st === "blocked" ? " (" + st + ")" : ""}`); }
    L.push("", `Gate ${ph.gate.id} ${ph.gate.name}: ${ev.pass ? "PASSED" : "open"}`);
    for (const r of ev.rows) L.push(`  - ${r.label}: ${r.got ?? "-"} (target ${r.op === "record" ? "record" : r.op + " " + r.value}) ${r.ok === true ? "pass" : r.ok === false ? "FAIL" : ""}`);
    L.push("");
  }
  return L.join("\n");
}
async function save(filename, data){
  if (cap.downloads){
    try{ await cap.downloads.save({filename, data}); toast("Saved " + filename); return; }
    catch(e){ if (e && e.code === "declined") return; }
  }
  const a = el("a", {href: URL.createObjectURL(new Blob([data])), download: filename}); document.body.append(a); a.click(); a.remove();
}
function viewSync(m){
  m.append(el("h1", null, "Sync and backup"));
  m.append(el("p", null, progressRef ? "Your progress, notes, photos and questions are saved to this workspace on claude.ai and stay private to you. A copy is also kept in this browser." :
    "This copy saves only in this browser. Open the published workspace on claude.ai to keep photos and progress across devices."));
  m.append(el("h2", null, "Export"));
  m.append(el("p", null, "Commit both files to the repo after each session: PROGRESS.md shows completion markers on GitHub, and the JSON restores everything here."));
  const stamp = new Date().toISOString().slice(0, 10);
  m.append(el("div", {class: "tools"},
    el("button", {class: "btn solid", onclick: () => save("PROGRESS.md", progressMarkdown())}, "Save PROGRESS.md"),
    el("button", {class: "btn", onclick: () => save(`wetstack-progress-${stamp}.json`, JSON.stringify({exported: Date.now(), state, notes, entries: entries.map(e => ({...e}))}, null, 1))}, "Save progress JSON")));
  m.append(el("h2", null, "Import"));
  const imp = el("input", {type: "file", accept: ".json,application/json", onchange: async e => {
    const f = e.target.files[0]; if (!f) return;
    try{
      const d = JSON.parse(await f.text());
      if (!d.state || !d.state.steps) throw new Error("Not a WetStack progress file");
      if (!confirm("Replace the progress on this page with the imported file?")) return;
      state = d.state; notes = d.notes || notes; state.updated = Date.now(); notes.updated = Date.now();
      writeLS(LS.state, state); writeLS(LS.notes, notes); schedulePush(); touchNotes(); render(); toast("Imported");
    }catch(err){ toast(err.message || "Could not read that file"); }
  }});
  m.append(el("label", {class: "btn"}, "Import progress JSON ", imp));
  m.append(el("h2", null, "Getting a review"));
  m.append(el("p", null, "To have the lab manager check your progress, gate numbers and photos in a chat, paste this workspace's link into a claude.ai conversation and ask for a progress review."));
  const theme = el("select", {"aria-label": "Theme", onchange: e => { const v = e.target.value; if (v === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", v); try{ localStorage.setItem("wetstack0.theme", v); }catch(_){} }},
    [["auto", "Match device"], ["light", "Light"], ["dark", "Dark"]].map(([v, l]) => el("option", {value: v, selected: (localStorage.getItem("wetstack0.theme") || "auto") === v ? true : null}, l)));
  m.append(el("h2", null, "Display"), el("div", {class: "filters"}, el("span", null, "Theme"), theme));
}

/* ---------- capabilities ---------- */
async function connect(){
  if (!window.claude || typeof window.claude.use !== "function") return;
  const names = ["db", "user", "assets", "sample", "downloads"];
  const got = await Promise.all(names.map(n => window.claude.use(n).catch(() => null)));
  names.forEach((n, i) => cap[n] = got[i]);
  if (cap.sample){ try{ const lim = await cap.sample.limits(); cap.imagesOk = !!(lim && lim.images); }catch(e){ cap.imagesOk = false; } }
  if (cap.db && cap.user){
    try{ uid = await cap.user.id(); }catch(e){ uid = null; }
    if (uid){
      progressRef = cap.db.doc(`data/users/${uid}/progress`);
      notesRef = cap.db.doc(`data/users/${uid}/notes`);
      entriesCol = cap.db.doc(`data/users/${uid}/journal`).collection("entries");
      const dot = document.getElementById("syncdot"); dot.classList.add("on"); dot.querySelector("span").textContent = "Saved to workspace";
      progressRef.onSnapshot(snap => {
        if (snap.metadata && snap.metadata.hasPendingWrites) return;
        if (!snap.exists){ if (state.updated) pushProgress(); return; }
        const d = snap.data();
        if ((d.updated || 0) > (state.updated || 0)){ state = JSON.parse(JSON.stringify(d)); writeLS(LS.state, state); safeRender(); }
        else if ((state.updated || 0) > (d.updated || 0)) schedulePush();
      }, () => {});
      notesRef.onSnapshot(snap => {
        if (snap.metadata && snap.metadata.hasPendingWrites) return;
        if (!snap.exists){ if (notes.updated) touchNotes(); return; }
        const d = snap.data();
        if ((d.updated || 0) > (notes.updated || 0)){ notes = JSON.parse(JSON.stringify(d)); writeLS(LS.notes, notes); safeRender(); }
      }, () => {});
      const localOnly = entries.slice();
      entriesCol.orderBy("t", "desc").limit(400).onSnapshot(qs => {
        entries = qs.docs.map(d => ({id: d.id, ...d.data()}));
        writeLS(LS.entries, entries); safeRender();
      }, () => {});
      for (const e of localOnly) if (!e.id && !e.asset){ try{ await entriesCol.add(e); }catch(_){} }
    }
  }
  safeRender();
}

(function init(){
  const t = (() => { try{ return localStorage.getItem("wetstack0.theme"); }catch(e){ return null; } })();
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  render();
  connect();
})();
