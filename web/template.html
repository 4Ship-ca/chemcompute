<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WetStack-0 lab workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Recursive:slnt,wght,CASL,CRSV,MONO@-15..0,300..900,0..1,0..1,0..1&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F7F6; --card:#FFFFFF; --ink:#172230; --muted:#586675; --rule:#D2DBE2; --wash:#EAF0F3;
  --acid:#C99510; --mid:#4F8F3A; --base:#1F5AA6; --fail:#B23A2B; --on-base:#FFFFFF;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --display:"Recursive","Segoe UI",system-ui,sans-serif;
  --mono:"Recursive",ui-monospace,"Cascadia Mono",Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10171E; --card:#16202A; --ink:#E4ECF1; --muted:#93A3B1; --rule:#2A3744; --wash:#1B2733;
    --acid:#E2B33C; --mid:#74B557; --base:#6497DA; --fail:#E46F5C; --on-base:#0D141A;
  }
}
:root[data-theme="dark"]{
  --paper:#10171E; --card:#16202A; --ink:#E4ECF1; --muted:#93A3B1; --rule:#2A3744; --wash:#1B2733;
  --acid:#E2B33C; --mid:#74B557; --base:#6497DA; --fail:#E46F5C; --on-base:#0D141A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--body)}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--base);outline-offset:2px}
a{color:var(--base)}
code,.cmd{font-family:var(--mono);font-variation-settings:"MONO" 1,"CASL" 0;font-size:.88em}
h1,h2,h3{font-family:var(--display);font-variation-settings:"CASL" .35,"MONO" 0;line-height:1.2;margin:0}
h1{font-size:clamp(1.6rem,3.2vw,2.15rem);font-weight:780;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:720;margin-top:2.2rem;margin-bottom:.6rem}
h3{font-size:1.02rem;font-weight:700;margin-top:1.4rem;margin-bottom:.35rem}
p{margin:.45rem 0 .8rem;max-width:70ch}
.muted{color:var(--muted)}
.small{font-size:.88rem}

/* header */
header.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--rule);
  padding-top:env(safe-area-inset-top,0px)}
.topin{max-width:1180px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
.brand b{font-family:var(--display);font-variation-settings:"CASL" .6;font-weight:820;font-size:1.25rem;letter-spacing:-.01em}
.brand span{font-size:.82rem;color:var(--muted)}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
nav.tabs button{border:0;background:none;padding:7px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:700}
nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--paper)}
nav.tabs button:hover:not([aria-current="page"]){background:var(--wash);color:var(--ink)}
.syncdot{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:2px}
.syncdot i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.syncdot.on i{background:var(--mid)}
.syncdot.warn{color:var(--ink);font-weight:700}
.syncdot.warn i{background:var(--acid)}

/* layout */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);gap:40px;max-width:1180px;margin:0 auto;padding:28px 24px 72px}
.shell>*{min-width:0}
main{max-width:800px;min-width:0}

/* titration rail */
.rail{position:sticky;top:92px;align-self:start}
.railgrid{display:grid;grid-template-columns:22px 1fr;gap:14px}
.burette{position:relative;border:1.5px solid var(--ink);border-top:0;border-radius:0 0 11px 11px;min-height:420px;background:var(--card);overflow:hidden}
.burette .fill{position:absolute;left:0;right:0;bottom:0;overflow:hidden;transition:height .6s ease}
.burette .fill::before{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(100% / var(--p));
  background:linear-gradient(to top,var(--acid) 0%,var(--mid) 50%,var(--base) 100%)}
.burette .tick{position:absolute;left:0;width:7px;height:1.5px;background:var(--ink)}
.phases{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;justify-content:space-between;min-height:420px}
.phases button{display:flex;gap:9px;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:4px 6px;border-radius:6px;cursor:pointer;color:var(--ink)}
.phases button:hover{background:var(--wash)}
.phases button[aria-current="true"]{background:var(--wash);font-weight:700}
.phases .pid{font-family:var(--mono);font-variation-settings:"MONO" 1;font-size:.8rem;color:var(--muted);min-width:22px}
.phases .ptitle{font-size:.9rem;line-height:1.3}
.mark{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);flex:none;align-self:center}
.mark.active{border-color:var(--mid);background:var(--mid)}
.mark.passed{border-color:var(--base);background:var(--base)}
.mark.blocked{border-color:var(--acid);background:var(--acid)}
.railnote{margin-top:16px;font-size:.84rem;color:var(--muted)}
.railnote strong{color:var(--ink);font-size:1.4rem;font-family:var(--display);font-variation-settings:"CASL" .4;display:block;line-height:1.1}
.hbar{display:none}

@media (max-width:880px){
  .shell{grid-template-columns:1fr;gap:18px;padding:16px 14px 56px}
  .rail{position:static}
  .railgrid{display:none}
  .hbar{display:block}
  .hbar .htube{position:relative;height:14px;border:1.5px solid var(--ink);border-left:0;border-radius:0 7px 7px 0;background:var(--card);overflow:hidden}
  .hbar .hfill{position:absolute;top:0;bottom:0;left:0;overflow:hidden}
  .hbar .hfill::before{content:"";position:absolute;top:0;bottom:0;left:0;width:calc(100% / var(--p));background:linear-gradient(to right,var(--acid),var(--mid),var(--base))}
  .hbar .chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px}
  .hbar .chips button{flex:none;border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:4px 10px;display:flex;gap:6px;align-items:center;cursor:pointer}
  .hbar .chips button[aria-current="true"]{border-color:var(--ink);font-weight:700}
  .topin{padding:10px 14px}
  nav.tabs{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap}
}

/* blocks */
.lede{font-size:1.06rem}
.next{display:flex;gap:14px;align-items:center;justify-content:space-between;border:1.5px solid var(--ink);border-radius:10px;padding:12px 16px;margin:18px 0;background:var(--card)}
.next b{font-family:var(--display);font-variation-settings:"CASL" .4}
.btn{border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:.92rem}
.btn:hover{background:var(--wash)}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.quiet{border-color:var(--rule);font-weight:400}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hyp{border-left:3px solid var(--mid);padding:4px 0 4px 14px;margin:12px 0}
.hyp b{font-family:var(--mono);font-variation-settings:"MONO" 1;font-size:.86rem}
.hyp .pc{font-size:.9rem;color:var(--muted);margin:.2rem 0}

ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}
ol.steps>li{border-top:1px solid var(--rule);padding:16px 0}
.srow{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.stitle{font-weight:700;font-size:1.02rem;display:flex;gap:10px;align-items:baseline}
.stitle .sid{font-family:var(--mono);font-variation-settings:"MONO" 1;font-size:.82rem;color:var(--muted);font-weight:400}
li.done .stitle span.t{text-decoration:line-through;text-decoration-color:var(--base);text-decoration-thickness:2px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--card);padding:4px 9px;font-size:.82rem;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"][data-v="doing"]{background:var(--mid);color:var(--on-base)}
.seg button[aria-pressed="true"][data-v="done"]{background:var(--base);color:var(--on-base)}
.seg button[aria-pressed="true"][data-v="blocked"]{background:var(--acid);color:#1a1300}
.seg button[aria-pressed="true"][data-v="todo"]{background:var(--wash);color:var(--ink)}
.cmdline{display:flex;gap:8px;align-items:center;background:var(--wash);border-radius:7px;padding:6px 10px;margin:.5rem 0;overflow-x:auto}
.cmdline code{white-space:nowrap;flex:1}
.cmdline button{border:0;background:none;color:var(--base);cursor:pointer;font-weight:700;font-size:.82rem;flex:none}
details.more{margin-top:.4rem}
details.more summary{cursor:pointer;color:var(--base);font-weight:700;font-size:.9rem}
textarea{width:100%;min-height:76px;border:1px solid var(--rule);border-radius:8px;background:var(--card);padding:8px 10px;resize:vertical}
input[type=number],input[type=text],select{border:1px solid var(--rule);border-radius:7px;background:var(--card);padding:5px 8px}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin:.5rem 0}
.photos img{width:96px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--rule)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:.5rem}
.cam{font-size:.8rem;color:var(--muted)}

.gate{margin-top:28px;border:1.5px solid var(--ink);border-radius:12px;background:var(--card);overflow:hidden}
.gatehead{padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--rule)}
.gatehead.pass{background:var(--base);color:var(--on-base)}
.gatehead h3{margin:0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--rule);vertical-align:top;font-size:.93rem}
th{font-weight:700;color:var(--muted);font-size:.84rem}
td.num{white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.8rem;font-weight:700}
.pill.ok{background:var(--base);color:var(--on-base)}
.pill.bad{background:var(--fail);color:#fff}
.pill.wait{background:var(--wash);color:var(--muted)}
.gatebody{padding:12px 18px 16px}
.gatebody input[type=number]{width:110px}

.matrix td.w{font-weight:700}
.matrix tr.chosen td{background:var(--wash)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:.6rem 0}
.flow span{border:1px solid var(--rule);border-radius:7px;padding:4px 9px;background:var(--card);font-size:.88rem}
.flow i{color:var(--muted);font-style:normal}
dl.pairs{margin:.4rem 0}
dl.pairs dt{font-weight:700;margin-top:.7rem}
dl.pairs dd{margin:.15rem 0 0;max-width:70ch}

.totals{display:flex;gap:28px;flex-wrap:wrap;margin:10px 0 18px}
.totals div b{display:block;font-family:var(--display);font-variation-settings:"CASL" .4;font-size:1.5rem;line-height:1.1}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bom td .nm{font-weight:700}
.bom td .nt{font-size:.84rem;color:var(--muted)}
.bom tr.have td{opacity:.62}
.bom input[type=number]{width:84px}

.thread{display:flex;flex-direction:column;gap:14px;margin:14px 0}
.msg{border-left:3px solid var(--rule);padding:2px 0 2px 14px;white-space:pre-wrap;max-width:72ch}
.msg.me{border-color:var(--ink)}
.msg.lab{border-color:var(--base)}
.msg .who{font-size:.8rem;color:var(--muted);display:block;margin-bottom:2px;white-space:normal}
.compose{border:1.5px solid var(--ink);border-radius:12px;padding:12px;background:var(--card)}
.entry{border-top:1px solid var(--rule);padding:14px 0}
.entry img{max-height:260px;border-radius:8px;border:1px solid var(--rule);display:block;margin:.4rem 0}
.empty{border:1.5px dashed var(--rule);border-radius:12px;padding:18px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:9px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <div class="brand"><b>WetStack-0</b><span id="tagline"></span>
    <div class="syncdot" id="syncdot"><i></i><span>Saved in this browser</span></div></div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div></header>
<div class="shell">
  <aside class="rail" id="rail" aria-label="Phases"></aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const DATA = /*__DATA__*/null;
const LS_DOC = "wetstack0.v2";
const LS_V1 = {state: "wetstack0.state", notes: "wetstack0.notes", entries: "wetstack0.entries"};
const TABS = [["build","Build"],["plan","Plan"],["parts","Parts"],["methods","Methods"],["ask","Ask"],["log","Log"],["sync","Save and sync"]];
const STEP_STATES = [["todo","To do"],["doing","Doing"],["done","Done"],["blocked","Blocked"]];
const GROUPS = {all:"All", electronics:"Electronics", equipment:"Equipment", materials:"Materials and consumables"};
const ID_RE = /^[A-Za-z0-9_.:\-]{1,64}$/;

/* ---------- small helpers ---------- */
function readLS(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function writeLS(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
function num(v, d = 0){ return typeof v === "number" && isFinite(v) ? v : d; }
function newId(){ return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8); }
function clone(x){ return JSON.parse(JSON.stringify(x)); }
function el(tag, props, ...kids){
  const n = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)){
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()){
    if (k == null || k === false) continue;
    n.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return n;
}
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2600); }
async function copy(text){
  try{ await navigator.clipboard.writeText(text); toast("Copied"); }
  catch(e){ const ta = el("textarea"); ta.value = text; document.body.append(ta); ta.select(); try{ document.execCommand("copy"); toast("Copied"); }catch(_){ toast("Select and copy manually"); } ta.remove(); }
}

/* ---------- the progress document (same rules as host/wetstack/progress_store.py) ---------- */
function emptyDoc(){ return {schema:"wetstack-progress", version:2, rev:0, updated:0, state:{steps:{}, gates:{}, bom:{}, meta:{phase:"P0", t:0}}, notes:{}, entries:[]}; }
function migrate(raw){
  const d = emptyDoc();
  if (!raw || typeof raw !== "object") return d;
  const src = raw.state && typeof raw.state === "object" ? raw.state : (raw.steps ? raw : {});
  let notesSrc = raw.notes || {};
  if (notesSrc && typeof notesSrc.notes === "object"){ const t = num(notesSrc.updated); const o = {}; for (const [k, v] of Object.entries(notesSrc.notes)) if (typeof v === "string") o[k] = {text: v, t}; notesSrc = o; }
  d.rev = Math.trunc(num(raw.rev)); d.updated = Math.trunc(num(raw.updated, num(src.updated)));
  for (const key of ["steps", "gates", "bom"]){
    const part = src[key] || {};
    for (const [id, item] of Object.entries(part)) if (ID_RE.test(id) && item && typeof item === "object"){ const c = clone(item); c.t = Math.trunc(num(item.t, d.updated)); d.state[key][id] = c; }
  }
  const meta = src.meta || {};
  d.state.meta = {phase: typeof meta.phase === "string" ? meta.phase : "P0", t: Math.trunc(num(meta.t, d.updated))};
  for (const [k, v] of Object.entries(notesSrc || {})){
    if (!ID_RE.test(k)) continue;
    if (typeof v === "string") d.notes[k] = {text: v, t: d.updated};
    else if (v && typeof v.text === "string") d.notes[k] = {text: v.text, t: Math.trunc(num(v.t, d.updated))};
  }
  (Array.isArray(raw.entries) ? raw.entries.slice(-5000) : []).forEach((e, i) => {
    if (!e || typeof e !== "object") return;
    const c = clone(e);
    c.id = typeof e.id === "string" && ID_RE.test(e.id) ? e.id : `legacy-${num(e.t)}-${i}`;
    c.t = Math.trunc(num(e.t));
    if (!["note", "photo", "qa"].includes(c.kind)) c.kind = "note";
    d.entries.push(c);
  });
  return d;
}
function newer(a, b){ if (!a) return b; if (!b) return a; return num(b.t) > num(a.t) ? b : a; }
function mergeDocs(x, y){
  const a = migrate(x), b = migrate(y), out = emptyDoc();
  for (const key of ["steps", "gates", "bom"]){
    for (const k of new Set([...Object.keys(a.state[key]), ...Object.keys(b.state[key])])) out.state[key][k] = clone(newer(a.state[key][k], b.state[key][k]));
  }
  out.state.meta = clone(newer(a.state.meta, b.state.meta));
  for (const k of new Set([...Object.keys(a.notes), ...Object.keys(b.notes)])) out.notes[k] = clone(newer(a.notes[k], b.notes[k]));
  const byId = new Map();
  for (const e of [...a.entries, ...b.entries]){
    const cur = byId.get(e.id);
    if (!cur){ byId.set(e.id, clone(e)); continue; }
    const w = num(e.edited, e.t) >= num(cur.edited, cur.t) ? e : cur;
    const m = clone(w);
    if (!m.a && (cur.a || e.a)){ const s = cur.a ? cur : e; m.a = s.a; m.a_t = s.a_t; }
    byId.set(e.id, m);
  }
  out.entries = [...byId.values()].sort((p, q) => num(p.t) - num(q.t)).slice(-5000);
  out.rev = Math.max(a.rev, b.rev); out.updated = Math.max(a.updated, b.updated);
  return out;
}

let doc, local;
(function bootDoc(){
  const saved = readLS(LS_DOC);
  if (saved && saved.doc){ doc = migrate(saved.doc); local = {dirty: !!saved.dirty, baseRev: num(saved.baseRev), seq: 0}; return; }
  const s1 = readLS(LS_V1.state), n1 = readLS(LS_V1.notes), e1 = readLS(LS_V1.entries);
  doc = (s1 || n1 || e1) ? migrate({state: s1 || {}, notes: n1 || {}, entries: e1 || [], updated: num(s1 && s1.updated)}) : emptyDoc();
  local = {dirty: !!(s1 || n1 || e1), baseRev: 0, seq: 0};
})();
let state = doc.state, entries = doc.entries;
function adopt(d){ doc = d; state = doc.state; entries = doc.entries; }
const store = {mode: "browser", status: "idle", rev: doc.rev, repo: "", lastSaved: null, lsOk: true, retry: 1000};
function persistLocal(){ store.lsOk = writeLS(LS_DOC, {doc, dirty: local.dirty, baseRev: local.baseRev, savedAt: Date.now()}); }
function noteGet(id){ const n = doc.notes[id]; return n ? n.text : ""; }

const ui = {tab: "build", open: new Set(), bomGroup: "all", bomPhase: "all", askStep: "general", pendingRender: false};
const cap = {db: null, user: null, assets: null, sample: null, downloads: null, imagesOk: false};
let progressRef = null, notesRef = null, entriesCol = null;
let askCtl = null, askBusy = false, askLive = "";

/* ---------- saving ---------- */
function touch(kind){
  doc.updated = Date.now(); local.dirty = true; local.seq++;
  persistLocal();
  if (store.mode === "server") scheduleServerSave();
  else if (store.mode === "workspace"){ if (kind === "notes") scheduleNotesPush(); else if (kind !== "entries") schedulePush(); }
  setStatus();
}
function setStatus(){
  const dot = document.getElementById("syncdot"); if (!dot) return;
  const span = dot.querySelector("span");
  dot.className = "syncdot";
  if (!store.lsOk){ dot.classList.add("warn"); span.textContent = "Browser storage is full or blocked: export now"; return; }
  if (store.mode === "server"){
    if (store.status === "saving"){ span.textContent = "Saving to progress.json"; return; }
    if (store.status === "offline"){ dot.classList.add("warn"); span.textContent = "Server not reachable: changes kept in this browser, retrying"; return; }
    dot.classList.add("on"); span.textContent = `Saved to progress.json, revision ${store.rev}`; return;
  }
  if (store.mode === "workspace"){ dot.classList.add("on"); span.textContent = "Saved to your claude.ai workspace"; return; }
  span.textContent = local.dirty ? "Saved in this browser only: export to keep a file" : "Saved in this browser only";
}

// Local server mode: progress/progress.json in the repo is the master copy.
let saveTimer = null, saving = false, saveAgain = false;
function scheduleServerSave(delay = 700){ clearTimeout(saveTimer); saveTimer = setTimeout(serverSave, delay); }
async function serverSave(){
  if (saving){ saveAgain = true; return; }
  saving = true; store.status = "saving"; setStatus();
  const sentSeq = local.seq;
  try{
    const r = await fetch("/api/progress", {method: "PUT", headers: {"Content-Type": "application/json", "X-WetStack": "1"},
      body: JSON.stringify({base_rev: local.baseRev, doc})});
    const j = await r.json();
    if (!r.ok) throw Object.assign(new Error(j.error || ("HTTP " + r.status)), {fatal: r.status === 400 || r.status === 403});
    if (j.merged && j.doc){
      const mine = local.seq !== sentSeq ? clone(doc) : null;
      adopt(mine ? mergeDocs(j.doc, mine) : migrate(j.doc));
      safeRender();
    }
    doc.rev = j.rev; local.baseRev = j.rev; store.rev = j.rev; store.lastSaved = Date.now();
    local.dirty = local.seq !== sentSeq; store.status = "saved"; store.retry = 1000;
    persistLocal();
    if (local.dirty) scheduleServerSave(300);
  }catch(e){
    store.status = "offline";
    if (e.fatal){ toast("Save refused: " + e.message); }
    else { setTimeout(serverSave, store.retry); store.retry = Math.min(30000, store.retry * 2); }
  }
  saving = false; setStatus();
  if (saveAgain){ saveAgain = false; serverSave(); }
}
async function serverPull(){
  if (saving || local.dirty || document.hidden) return;
  try{
    const r = await fetch("/api/progress?rev=" + local.baseRev, {cache: "no-store"});
    const j = await r.json();
    if (j.unchanged) { if (store.status === "offline"){ store.status = "saved"; setStatus(); } return; }
    if (local.dirty) return;
    adopt(migrate(j.doc)); local.baseRev = j.rev; store.rev = j.rev; store.status = "saved";
    persistLocal(); setStatus(); safeRender();
  }catch(e){ store.status = "offline"; setStatus(); }
}
async function serverConnect(){
  const r = await fetch("/api/progress", {cache: "no-store"});
  const j = await r.json();
  if (local.dirty){ await serverSave(); }
  else { adopt(migrate(j.doc)); local.baseRev = j.rev; store.rev = j.rev; persistLocal(); }
  store.status = "saved";
  setInterval(serverPull, 15000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) serverPull(); });
}

// claude.ai workspace mode
let pushTimer = null, pushing = false, pushAgain = false, notesTimer = null;
function schedulePush(){ if (!progressRef) return; clearTimeout(pushTimer); pushTimer = setTimeout(pushProgress, 900); }
async function pushProgress(){
  if (!progressRef) return;
  if (pushing){ pushAgain = true; return; }
  pushing = true;
  try{ await progressRef.set({schema: "wetstack-progress", version: 2, state: clone(doc.state), updated: doc.updated}); local.dirty = false; persistLocal(); }
  catch(e){ if (e && e.code === "quota_exceeded") toast("Workspace storage is full; export a backup"); }
  pushing = false; setStatus();
  if (pushAgain){ pushAgain = false; pushProgress(); }
}
function scheduleNotesPush(){ if (!notesRef) return; clearTimeout(notesTimer); notesTimer = setTimeout(async () => {
  try{ await notesRef.set({version: 2, notes: clone(doc.notes), updated: doc.updated}); }catch(e){} }, 1200); }

async function uploadPhoto(file, stepId){

/* ---------- derived data ---------- */
const PH = DATA.phases;
const ALLSTEPS = PH.flatMap(p => p.steps.map(s => ({...s, phase: p.id})));
const STEP = Object.fromEntries(ALLSTEPS.map(s => [s.id, s]));
function stepState(id){ return (state.steps[id] && state.steps[id].s) || "todo"; }
function gateValues(gid){ return (state.gates[gid] && state.gates[gid].values) || {}; }
function check(op, got, target){
  if (got === undefined || got === null || got === "" || Number.isNaN(got)) return null;
  if (op === ">=") return got >= target;
  if (op === "<=") return got <= target;
  if (op === "==") return Math.abs(got - target) < 1e-9;
  return true;
}
function gateEval(ph){
  const vals = gateValues(ph.gate.id);
  const rows = ph.gate.criteria.map(c => ({...c, got: vals[c.key], ok: check(c.op, vals[c.key], c.value)}));
  return {rows, pass: rows.every(r => r.ok === true), met: rows.filter(r => r.ok === true).length};
}
function phaseStatus(ph){
  if (gateEval(ph).pass) return "passed";
  const ss = ph.steps.map(s => stepState(s.id));
  if (ss.includes("blocked")) return "blocked";
  if (ss.some(s => s !== "todo")) return "active";
  return "todo";
}
function progress(){ const done = ALLSTEPS.filter(s => stepState(s.id) === "done").length; return {done, total: ALLSTEPS.length, p: done / ALLSTEPS.length}; }
function bomStatus(item){ const b = state.bom[item.id]; return b && b.st ? b.st : (item.onhand ? "have" : "need"); }
function groupOf(kind){ return kind === "material" || kind === "consumable" ? "materials" : kind; }

    if (!ui.pendingRender){ ui.pendingRender = true; a.addEventListener("blur", () => { ui.pendingRender = false; render(); }, {once: true}); }
    return;

}

function viewGate(ph){
  const g = ph.gate, ev = gateEval(ph);
  const box = el("section", {class: "gate", "aria-label": "Gate " + g.id});
  box.append(el("div", {class: "gatehead" + (ev.pass ? " pass" : "")}, el("h3", null, `Gate ${g.id}: ${g.name}`), el("span", null, ev.pass ? "Passed" : `${ev.met} of ${ev.rows.length} criteria met`)));
  const tb = el("tbody");
  for (const r of ev.rows){
    const inp = el("input", {type: "number", step: "any", "aria-label": r.label});
    if (r.got !== undefined && r.got !== null) inp.value = r.got;
    inp.addEventListener("change", () => {
      const vals = {...gateValues(g.id)};
      if (inp.value === "") delete vals[r.key]; else vals[r.key] = Number(inp.value);
      state.gates[g.id] = {...(state.gates[g.id] || {}), values: vals, t: Date.now()}; touch("gates"); render();
    });
    const target = r.op === "record" ? "record" : `${r.op} ${r.value}${r.unit ? " " + r.unit : ""}`;
    tb.append(el("tr", null, el("td", null, r.label), el("td", {class: "num"}, target), el("td", null, inp),
      el("td", null, el("span", {class: "pill " + (r.ok === true ? "ok" : r.ok === false ? "bad" : "wait")}, r.ok === true ? "pass" : r.ok === false ? "fail" : "waiting"))));
  }
  const imp = el("input", {type: "file", accept: ".json,application/json", style: "display:none", onchange: async e => {
    const f = e.target.files[0]; if (!f) return;
    try{
      const proof = JSON.parse(await f.text());
      if (proof.gate !== g.id || !proof.metrics) throw new Error("This proof file is for " + (proof.gate || "another gate"));
      const vals = {...gateValues(g.id)};
      for (const c of g.criteria) if (typeof proof.metrics[c.key] === "number") vals[c.key] = proof.metrics[c.key];
      state.gates[g.id] = {values: vals, t: Date.now(), proofMode: proof.mode}; touch("gates"); render();
      toast(proof.mode === "sim" ? "Imported simulation values; real runs replace these" : "Proof imported");
    }catch(err){ toast(err.message || "Not a proof file"); }
  }});
  box.append(el("div", {class: "gatebody"},
    el("div", {class: "scroll"}, el("table", null, el("thead", null, el("tr", null, el("th", null, "Criterion"), el("th", null, "Target"), el("th", null, "Measured"), el("th", null, "Result"))), tb)),
    el("div", {class: "tools"}, cmdLine(g.cmd), el("label", {class: "btn quiet"}, "Import proof file", imp)),
    el("p", {class: "small muted"}, `The command writes proofs/${g.id}.json. Import it here, or type the numbers in.`),
    el("details", {class: "more"}, el("summary", null, "If the gate fails"), el("ul", null, g.if_fail.map(x => el("li", null, x))))));
  return box;
}

  m.append(el("div", {class: "scroll"}, el("table", {class: "bom"}, el("thead", null, el("tr", null, ["Item", "Qty", "Estimate", "Source", "Needed", "Status", "Paid"].map(h => el("th", null, h)))), tb)));
}

function viewMethods(m){
  m.append(el("h1", null, "Methods, safety and recipes"));
  m.append(el("h2", null, "(d) How we run experiments"), el("dl", {class: "pairs"}, DATA.methods.flatMap(([a, b]) => [el("dt", null, a), el("dd", null, b)])));

/* ---------- Ask ---------- */
const RULES = `You are the lab manager and instructor for WetStack-0, a home-lab electro-chemical neuron project. The person asking is your junior lab partner and does the hands-on work at a home bench.
How to answer:
- Be specific and practical: name the exact next action, the expected reading, and how to tell success from failure.
- Safety comes first. Never approve mixing bleach with any acid, chloride in the platinum electrolysis cells, more than 12 V DC on the bench, unattended lithium charging, or skipping eye protection. If a plan is unsafe, say so and give the safe alternative.
- Respect the project rules: gates are pass/fail; the linear-relay rule (electronics may only multiply a signal by a fixed gain between chemical layers); absorbance features, not raw brightness; every claim has a control.
- If a photo is attached, describe what you see that matters for this step, and say whether it looks right.
- If data are missing, ask for the specific numbers or file you need. Keep answers under about 300 words unless asked for more. Plain text, short paragraphs or numbered steps.`;
function contextFor(stepId){
  const pr = progress();
  const lines = [`Project progress: ${pr.done}/${pr.total} steps done. Gates passed: ${PH.filter(p => gateEval(p).pass).map(p => p.gate.id).join(", ") || "none"}.`];
  if (stepId !== "general" && STEP[stepId]){
    const s = STEP[stepId], ph = PH.find(p => p.id === s.phase);
    lines.push(`Current phase ${ph.id} "${ph.title}". Goal: ${ph.goal}`);
    lines.push(`Current step ${s.id} "${s.title}" (status: ${stepState(s.id)}). Instructions: ${s.detail}${s.cmd ? " Command: " + s.cmd : ""}`);
    if (noteGet(s.id)) lines.push(`My notes on this step: ${noteGet(s.id).slice(0, 1500)}`);
    const ev = gateEval(ph);
    lines.push(`Gate ${ph.gate.id} "${ph.gate.name}": ` + ev.rows.map(r => `${r.label} target ${r.op} ${r.value}, measured ${r.got ?? "not yet"}`).join("; "));
    for (const h of ph.hypotheses) lines.push(`Hypothesis ${h.id}: ${h.text} Pass: ${h.pass} Control: ${h.control}`);
  } else {
    const ph = PH.find(p => p.id === (state.meta.phase || "P0"));
    lines.push(`I am currently on phase ${ph.id} "${ph.title}".`);
  }
  return lines.join("\n");
}
function threadFor(stepId){ return entries.filter(e => e.kind === "qa" && (e.step || "general") === stepId).sort((a, b) => a.t - b.t); }
function viewAsk(m){
  m.append(el("h1", null, "Ask the lab manager"));
  if (store.mode === "server") m.append(el("p", null, "Questions save into progress.json for Claude Code. In Claude Code, say \"answer my lab questions\"; answers appear here within 15 seconds."));
  const sel = el("select", {"aria-label": "Context", onchange: e => { ui.askStep = e.target.value; render(); }},
    el("option", {value: "general", selected: ui.askStep === "general" ? true : null}, "General question"),
    PH.map(ph => el("optgroup", {label: `${ph.id} ${ph.title}`}, ph.steps.map(s => el("option", {value: s.id, selected: ui.askStep === s.id ? true : null}, `${s.id} ${s.title}`)))));
  m.append(el("div", {class: "filters"}, el("span", {class: "muted"}, "About"), sel));
  const thread = el("div", {class: "thread"});
  const past = threadFor(ui.askStep);
  if (!past.length && !askBusy) thread.append(el("div", {class: "empty"}, "No questions on this yet. Your step, notes and gate numbers go along with the question, so short questions work."));
  for (const e of past){
    thread.append(el("div", {class: "msg me"}, el("span", {class: "who"}, new Date(e.t).toLocaleString()), e.q));
    if (imgSrc(e)) thread.append(el("img", {src: imgSrc(e), alt: "Attached photo", style: "max-width:240px;border-radius:8px"}));
    thread.append(e.a ? el("div", {class: "msg lab"}, el("span", {class: "who"}, e.a_by || "Lab manager"), e.a)
                      : el("div", {class: "msg lab muted"}, el("span", {class: "who"}, "Waiting"), "Not answered yet. In Claude Code, say \"answer my lab questions\"."));
  }
  thread.append(el("div", {class: "msg lab", style: askBusy ? "" : "display:none"}, el("span", {class: "who"}, "Lab manager"), el("span", {id: "livetext"}, askLive || "Thinking...")));
  m.append(thread);
  const q = el("textarea", {placeholder: "What's happening, what you measured, what you want to know", "aria-label": "Question"});
  const file = el("input", {type: "file", accept: "image/jpeg,image/png,image/webp", "aria-label": "Attach a photo"});
  const live = !!cap.sample;
  const send = el("button", {class: "btn solid", disabled: askBusy ? true : null, onclick: () => ask(q, file)}, live ? "Send" : store.mode === "server" ? "Save question for Claude Code" : "Copy for a chat");
  const stop = el("button", {class: "btn", style: askBusy ? "" : "display:none", onclick: () => askCtl && askCtl.abort()}, "Stop");
  const showFile = (live && cap.imagesOk) || store.mode === "server";
  const compose = el("div", {class: "compose"}, q, el("div", {class: "tools"}, send, stop, showFile ? el("label", {class: "small"}, "Photo ", file) : null,
    el("button", {class: "btn quiet", onclick: () => copy(RULES + "\n\n" + contextFor(ui.askStep) + "\n\nMy question: " + q.value)}, "Copy with context")));
  if (!live && store.mode !== "server") compose.append(el("p", {class: "small muted"}, "Opened as a plain file, this page can't send questions. Copy the question with its context and paste it into Claude Code or a claude.ai chat, or open the page with python -m wetstack serve."));
  m.append(compose);
}
async function ask(q, file){
  const text = q.value.trim();
  if (!text || askBusy) return;
  const stepId = ui.askStep, img = file && file.files && file.files[0] ? file.files[0] : null;
  if (!cap.sample){
    if (store.mode !== "server"){ copy(RULES + "\n\n" + contextFor(stepId) + "\n\nMy question: " + text); return; }
    let where = {};
    if (img){ try{ where = await uploadPhoto(img, stepId); }catch(e){ toast(e.message); } }
    await addEntry({kind: "qa", step: stepId === "general" ? null : stepId, q: text, a: "", ...where});
    toast("Question saved for Claude Code"); return;
  }
  const turns = [{role: "user", content: RULES + "\n\nProject context:\n" + contextFor(stepId)}];
  for (const e of threadFor(stepId).slice(-4)) if (e.a){ turns.push({role: "user", content: e.q}); turns.push({role: "assistant", content: e.a}); }
  turns.push({role: "user", content: text});
  askBusy = true; askLive = ""; askCtl = new AbortController(); render();
  try{
    const opts = {signal: askCtl.signal, cache: false, onText: ({text}) => { askLive = text; const n = document.getElementById("livetext"); if (n) n.textContent = text; }};
    if (img) opts.images = [img];
    const res = await cap.sample(turns, opts);
    let where = {};
    if (img){ try{ where = await uploadPhoto(img, stepId); }catch(e){} }
    askBusy = false; askLive = "";
    await addEntry({kind: "qa", step: stepId, q: text, a: res.text + (res.truncated ? "\n\n(Answer cut short; ask for the rest.)" : ""), ...where});
  }catch(e){
    askBusy = false; askLive = "";
    const msgs = {not_granted: "Asking Claude was not allowed for this page.", rate_limited: "Too many questions right now; try again in a minute.",
      session_expired: "Sign in to claude.ai again.", refused: "That question could not be answered; rephrase it.", image_rejected: "That photo could not be read; try a JPEG under 20 MB."};
    if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) cap.sample = null;
    if (e && e.text && e.code !== "refused") await addEntry({kind: "qa", step: stepId, q: text, a: e.text + "\n\n(Interrupted.)"});
    if (!e || e.code !== "cancelled") toast(msgs[e && e.code] || "Could not reach Claude; try again.");
  }
  askCtl = null; render();
}

/* ---------- Log ---------- */
function viewLog(m){
  m.append(el("h1", null, "Lab log"));
  m.append(el("p", null, "Notes and photos from the bench, newest first. Photos attached to steps appear here too."));
  const stepSel = el("select", {"aria-label": "Step"}, el("option", {value: ""}, "No particular step"), ALLSTEPS.map(s => el("option", {value: s.id}, `${s.id} ${s.title}`)));

  m.append(el("div", {class: "compose"}, el("div", {class: "filters"}, stepSel), ta, el("div", {class: "tools"}, save, uploadButton(null, "Add photo to log"))));

      imgSrc(e) ? el("img", {src: imgSrc(e), alt: e.text || "Lab photo", loading: "lazy"}) : null,
      e.kind === "note" ? el("p", null, e.text) : el("p", {class: "small muted"}, e.text || "")));
  }
}

/* ---------- Save and sync ---------- */
function progressMarkdown(){
  const L = ["# WetStack-0 progress", "", `Exported ${new Date().toISOString()}`, ""];
  for (const ph of PH){
    const ev = gateEval(ph);
    L.push(`## ${ph.id} ${ph.title}`, "");
    for (const s of ph.steps){ const st = stepState(s.id); L.push(`- [${st === "done" ? "x" : " "}] ${s.id} ${s.title}${st === "doing" || st === "blocked" ? " (" + st + ")" : ""}`); }
    L.push("", `Gate ${ph.gate.id} ${ph.gate.name}: ${ev.pass ? "PASSED" : "open"}`);
    for (const r of ev.rows) L.push(`  - ${r.label}: ${r.got ?? "-"} (target ${r.op === "record" ? "record" : r.op + " " + r.value}) ${r.ok === true ? "pass" : r.ok === false ? "FAIL" : ""}`);
    L.push("");
  }
  return L.join("\n");
}
async function saveFile(filename, data){
  if (cap.downloads){
    try{ await cap.downloads.save({filename, data}); toast("Saved " + filename); return; }
    catch(e){ if (e && e.code === "declined") return; }
  }
  const a = el("a", {href: URL.createObjectURL(new Blob([data])), download: filename}); document.body.append(a); a.click(); a.remove();
}
function viewSync(m){
  m.append(el("h1", null, "Save and sync"));
  const modeText = {
    server: `Every change saves within a second to progress/progress.json in ${store.repo || "your repo"} (revision ${store.rev}). Each save is atomic and the previous version goes to progress/backups/. PROGRESS.md is rebuilt on every save. If the server stops, changes wait in this browser and save when it's back.`,
    workspace: "Progress, notes, photos and questions save to this workspace on claude.ai, private to you. A copy is also kept in this browser.",
    browser: "This page was opened as a plain file, so it saves only in this browser. For saving into the repo, start it with python -m wetstack serve --open. Until then, export a JSON file at the end of every session.",
  }[store.mode];
  m.append(el("p", null, modeText));
  if (store.mode === "server"){
    const msg = el("input", {type: "text", placeholder: "Session message, e.g. P0 pipette calibration", style: "min-width:260px;flex:1", "aria-label": "Commit message"});
    const push = el("input", {type: "checkbox", id: "pushbox", checked: true});
    const out = el("pre", {class: "small", style: "white-space:pre-wrap;display:none"});
    const btn = el("button", {class: "btn solid", onclick: async () => {
      btn.disabled = true; out.style.display = "block"; out.textContent = "Committing...";
      try{
        if (local.dirty) await serverSave();
        const r = await fetch("/api/commit", {method: "POST", headers: {"Content-Type": "application/json", "X-WetStack": "1"}, body: JSON.stringify({message: msg.value, push: push.checked})});
        const j = await r.json(); out.textContent = (j.ok ? "Done.\n" : "Not finished:\n") + (j.log || j.error || "");
      }catch(e){ out.textContent = "The server did not answer: " + e.message; }
      btn.disabled = false;
    }}, "Commit to git");
    m.append(el("h2", null, "Commit this session"), el("div", {class: "tools"}, msg, btn, el("label", {class: "small", for: "pushbox"}, push, " and push to GitHub")), out);
  }
  m.append(el("h2", null, "Export a backup"));
  const stamp = new Date().toISOString().slice(0, 10);
  m.append(el("div", {class: "tools"},
    el("button", {class: "btn", onclick: () => saveFile(`wetstack-progress-${stamp}.json`, JSON.stringify(doc, null, 1))}, "Save progress JSON"),
    store.mode === "server" ? null : el("button", {class: "btn", onclick: () => saveFile("PROGRESS.md", progressMarkdown())}, "Save PROGRESS.md")));
  m.append(el("h2", null, "Load a file"));
  m.append(el("p", null, "Merging keeps everything from both sides, taking the newer version of each step, note, part and gate. Replacing throws away what's here, so it asks first."));
  const pick = (mode) => el("input", {type: "file", accept: ".json,application/json", style: "display:none", onchange: async e => {
    const f = e.target.files[0]; if (!f) return;
    try{
      const incoming = migrate(JSON.parse(await f.text()));
      if (mode === "replace"){
        if (!confirm("Replace everything on this page with the file? The current version stays in backups if you use the local server.")) return;
        incoming.rev = doc.rev; adopt(incoming);
        Object.values(state.steps).concat(Object.values(state.gates), Object.values(state.bom), Object.values(doc.notes)).forEach(x => x.t = Date.now());
        state.meta.t = Date.now();
      } else adopt(mergeDocs(doc, incoming));
      touch("import"); render(); toast(mode === "replace" ? "Replaced" : "Merged");
    }catch(err){ toast("Could not read that file: " + (err.message || "not JSON")); }
  }});
  m.append(el("div", {class: "tools"}, el("label", {class: "btn"}, "Merge a file", pick("merge")), el("label", {class: "btn quiet"}, "Replace with a file", pick("replace"))));
  m.append(el("h2", null, "Recovery"));
  m.append(el("ul", null,
    el("li", null, "Every server save keeps the previous version in progress/backups/ (last 40). Restore one with ", el("code", null, "python -m wetstack progress restore progress/backups/<file>"), "."),
    el("li", null, "Committed versions are in git history: ", el("code", null, "git log -- progress/progress.json"), "."),
    el("li", null, "This browser always keeps its own copy, so a closed tab or a stopped server never loses an edit.")));
  const theme = el("select", {"aria-label": "Theme", onchange: e => { const v = e.target.value; if (v === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", v); try{ localStorage.setItem("wetstack0.theme", v); }catch(_){} }},
    [["auto", "Match device"], ["light", "Light"], ["dark", "Dark"]].map(([v, l]) => el("option", {value: v, selected: ((() => { try{ return localStorage.getItem("wetstack0.theme"); }catch(_){ return null; } })() || "auto") === v ? true : null}, l)));
  m.append(el("h2", null, "Display"), el("div", {class: "filters"}, el("span", null, "Theme"), theme));
}

/* ---------- connect ---------- */
async function connect(){
  if (location.protocol.startsWith("http") && ["127.0.0.1", "localhost"].includes(location.hostname)){
    try{
      const r = await fetch("/api/ping", {cache: "no-store"});
      const j = await r.json();
      if (j.server === "wetstack"){ store.mode = "server"; store.repo = j.repo; await serverConnect(); safeRender(); return; }
    }catch(e){}
  }
  if (!window.claude || typeof window.claude.use !== "function"){ setStatus(); return; }
  const names = ["db", "user", "assets", "sample", "downloads"];
  const got = await Promise.all(names.map(n => window.claude.use(n).catch(() => null)));
  names.forEach((n, i) => cap[n] = got[i]);
  if (cap.sample){ try{ const lim = await cap.sample.limits(); cap.imagesOk = !!(lim && lim.images); }catch(e){ cap.imagesOk = false; } }
  let uid = null;
  if (cap.db && cap.user){ try{ uid = await cap.user.id(); }catch(e){ uid = null; } }
  if (uid){
    store.mode = "workspace";
    progressRef = cap.db.doc(`data/users/${uid}/progress`);
    notesRef = cap.db.doc(`data/users/${uid}/notes`);
    entriesCol = cap.db.doc(`data/users/${uid}/journal`).collection("entries");
    progressRef.onSnapshot(snap => {
      if (snap.metadata && snap.metadata.hasPendingWrites) return;
      if (!snap.exists){ if (doc.updated) pushProgress(); return; }
      const d = snap.data();
      const remote = migrate({state: d.state || d, updated: d.updated});
      const merged = mergeDocs({...remote, notes: doc.notes, entries: doc.entries}, doc);
      const changedLocal = JSON.stringify(merged.state) !== JSON.stringify(remote.state);
      adopt(merged); persistLocal(); safeRender();
      if (changedLocal) schedulePush();
    }, () => {});
    notesRef.onSnapshot(snap => {
      if (snap.metadata && snap.metadata.hasPendingWrites) return;
      if (!snap.exists){ if (Object.keys(doc.notes).length) scheduleNotesPush(); return; }
      const remote = migrate({notes: snap.data()});
      const merged = mergeDocs({...doc, notes: remote.notes}, doc);
      const changedLocal = JSON.stringify(merged.notes) !== JSON.stringify(remote.notes);
      adopt(merged); persistLocal(); safeRender();
      if (changedLocal) scheduleNotesPush();
    }, () => {});
    const pending = doc.entries.slice();
    entriesCol.orderBy("t", "desc").limit(1000).onSnapshot(qs => {
      const remote = qs.docs.map(d => ({...d.data(), id: d.id}));
      const ids = new Set(remote.map(e => e.id));
      doc.entries = remote.concat(doc.entries.filter(e => !ids.has(e.id) && !e._synced)).sort((a, b) => a.t - b.t);
      entries = doc.entries; persistLocal(); safeRender();
    }, () => {});
    for (const e of pending){ try{ await entriesCol.doc(e.id).set(e); }catch(_){} }
  }
  safeRender();
}

(function init(){
  const t = (() => { try{ return localStorage.getItem("wetstack0.theme"); }catch(e){ return null; } })();
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  render();
  connect();
})();
